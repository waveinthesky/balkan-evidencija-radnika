 // Ukupno za odmor = pravo za godinu + važeći prenos iz prethodne godine
 // Preostalo       = ukupno − iskorišćeno − planirano (odobreno unaprijed)
 // Nije radio (N)  = radni dani bez prijave od početka evidencije; NE oduzima se od godišnjeg.
 function evidenceStart(e,y){
  const ins=S.events.filter(v=>v.empId===e.id).map(v=>dateOfEvent(v.at));
  const ovs=S.overrides.filter(o=>o.empId===e.id&&['P','N','IA'].includes(o.status)).map(o=>o.date);
  const cands=[e.attendanceFrom,...ins,...ovs].filter(Boolean).sort();
  if(!cands.length)return null;
  let start=cands[0];
  const jan=ymd(y,1,1);if(start<jan)start=jan;
  if(e.hiredAt&&start<e.hiredAt)start=e.hiredAt;
  return start;
 }
 function absentDays(e,y){
  const start=evidenceStart(e,y);if(!start)return [];
  const end=[today(),ymd(y,12,31)].sort()[0],scanned=new Set(S.events.filter(v=>v.empId===e.id&&v.kind==='in').map(v=>dateOfEvent(v.at)));
  const out=[];
  for(let x=new Date(start+'T12:00:00Z');;x.setUTCDate(x.getUTCDate()+1)){
   const d=x.toISOString().slice(0,10);if(d>=end)break;
   if(scanned.has(d)||!employeeAt(e,d))continue;
   const loc=assigned(e,d);if(!loc||!isWorking(loc,d))continue;
   const st=dayStatus(e,d,loc);if(st==='N'||st==='IA')out.push(d);
  }
  return out;
 }
 function carrySource(e,y,a){
  const explicit=e.leaveCarryByYear?.[y];
  if(explicit!=null&&explicit!=='')return {kind:'manual',text:'Ručno uneseno'+(e.leaveCarryNoteByYear?.[y]?' – '+e.leaveCarryNoteByYear[y]:'')};
  if(y!==2026)return {kind:'none',text:'Prenos iz '+(y-1)+'. nije unesen'};
  const A=window.BALKAN_ARCHIVE;
  if(!A?.isLoaded?.())return {kind:'none',text:'Arhiva 2025. nije uvezena – unesi prenos ručno'};
  if(a.provisional)return {kind:'archive',text:'Iz arhive 2025. (Excel) – nije potvrđeno'};
  return {kind:'none',text:'Nije pronađen u arhivi 2025. pod imenom „'+e.name+'“ – unesi ručno'};
 }
 function lvBalance(e,year){
  const y=Number(year),s=yearLeaveSummary(e,y),a=balkanCarryAudit(e,y);
  const quota=s.quota==null?null:Number(s.quota),used=Number(s.used)||0,planned=Number(s.planned)||0;
  const carryUsable=a.spentOnCarry+a.active+a.negative;
  const total=quota==null?null:quota+carryUsable;
  return {quota,carry:a.raw,carryUsable,carrySpent:a.spentOnCarry,carryActive:a.active,carryExpired:a.expired,carryNegative:a.negative,
   carryDeadline:a.deadline,carrySource:carrySource(e,y,a),carryKnown:a.known,
   total,used,planned,absent:absentDays(e,y).length,remaining:total==null?null:total-used-planned,
   accrued:s.accrued,confirmed:!!s.rightConfirmed};
 }

// ===================== ZAKONSKA USKLAĐENOST – Zakon o radu CG (19.10.2026.) =====================
(function(){
 // 1) Državni praznici CG koji su neradni dani (Zakon o državnim i drugim praznicima; Njegošev dan od 2025).
 //    Čl. 80 st. 4 Zakona o radu: praznici koji su neradni dani ne uračunavaju se u godišnji odmor.
 function cgStateHolidays(y){
  const L=[['Nova godina','01-01','01-02'],['Praznik rada','05-01','05-02'],['Dan nezavisnosti','05-21','05-22'],['Dan državnosti','07-13','07-14']];
  if(y>=2025)L.push(['Njegošev dan','11-13','11-14']);
  // Praznici se praznuju dva dana. Ako je prvi dan nedjelja, neradna su dva naredna dana;
  // ako je drugi dan nedjelja, neradan je i prvi naredni dan.
  const sun=d=>new Date(d+'T12:00:00Z').getUTCDay()===0,next=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
  return L.map(([label,a,b])=>{const date=y+'-'+a;let end=y+'-'+b;
   if(sun(date))end=next(date,2);else if(sun(end))end=next(end,1);
   return {label,date,endDate:end}});
 }
 function missingStateHolidays(y){
  return cgStateHolidays(y).filter(h=>!(S.holidays||[]).some(x=>x.paid&&!x.employeeId&&x.date<=h.date&&(x.endDate||x.date)>=h.endDate));
 }
 window.balkanMissingStateHolidays=missingStateHolidays;
 const _absences=absences;
 absences=function(){
  const html=_absences(),y=new Date().getFullYear();
  const rows=[y,y+1].map(yy=>{const miss=missingStateHolidays(yy);
   return '<div class="actionline" style="margin:6px 0"><b>'+yy+'.</b> '+(miss.length?'<span class="badge N">Nedostaje: '+miss.map(h=>esc(h.label)).join(', ')+'</span><button class="btn small primary" type="button" data-cg-holidays="'+yy+'">Dodaj državne praznike CG za '+yy+'.</button>':'<span class="badge P">Svi državni praznici su uneseni</span>')+'</div>'}).join('');
  const panel='<section class="panel" id="cgHolidays"><h2>Državni praznici Crne Gore</h2><p class="smalltext">Neradni dani: Nova godina (1–2.1.), Praznik rada (1–2.5.), Dan nezavisnosti (21–22.5.), Dan državnosti (13–14.7.) i Njegošev dan (13–14.11.). Ne troše godišnji odmor i ne broje se kao izostanak. Vjerske praznike i pomjerene neradne dane (npr. kad praznik padne u nedjelju) dodaj posebno, prema odluci Vlade.</p>'+rows+'</section>';
  return html.replace('<div class="panel"><h2>Praznici i posebni dani</h2>',panel+'<div class="panel"><h2>Praznici i posebni dani</h2>');
 };
 document.getElementById('app').addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-cg-holidays]');if(!b)return;
  ev.preventDefault();ev.stopImmediatePropagation();if(!unlocked)return;
  const y=Number(b.dataset.cgHolidays),miss=missingStateHolidays(y);if(!miss.length)return;
  if(!confirm('Dodati državne praznike Crne Gore za '+y+'.?\n\n'+miss.map(h=>h.label+': '+h.date.slice(8)+'.'+h.date.slice(5,7)+'. – '+h.endDate.slice(8)+'.'+h.endDate.slice(5,7)+'.').join('\n')+'\n\nVrijede za sve objekte i sve radnike, kao plaćeni neradni dani.'))return;
  for(const h of miss)S.holidays.push({id:uid(),date:h.date,endDate:h.endDate,type:'state',label:h.label,locationId:null,employeeId:null,paid:true});
  audit('Dodati državni praznici CG',y+': '+miss.map(h=>h.label).join(', '));
  try{await save();render()}catch(err){alert('Nije sačuvano: '+err.message)}
 },true);

 // 2) Čl. 79 st. 3–4: 1/12 godišnjeg odmora za svaki ZAPOČETI mjesec rada u godini zasnivanja/prestanka
 //    radnog odnosa; najmanje pola dana zaokružuje se na cijeli dan.
 annualEntitlementSuggestion=function(employee,year,daysPerWeek=5,cutoff=''){
  const base=daysPerWeek===6?24:20,first=String(year)+'-01-01',last=String(year)+'-12-31';
  if(!employee)return {days:0,months:0,base,known:false};
  const hired=employee.hiredAt&&employee.hiredAt.length===10?employee.hiredAt:'';
  const terminated=employee.terminatedAt&&employee.terminatedAt.length===10?employee.terminatedAt:'';
  if(!hired)return {days:base,months:12,base,known:false};
  const start=hired>first?hired:first,end=[last,terminated||last,cutoff||last].sort()[0];
  if(start>end)return {days:0,months:0,base,known:true};
  let months=0;
  for(let m=1;m<=12;m++){const from=ymd(year,m,1),to=ymd(year,m,new Date(year,m,0).getDate());if(to<start||from>end)continue;months++}
  return {days:Math.floor(base*months/12+0.5),months,base,known:true};
 };

 // 3) Upozorenja u obrascu za rješenje (čl. 85 st. 3).
 const legalHints=()=>{
  const sum=document.getElementById('wzSum'),f=document.getElementById('leaveDecisionForm');
  if(!sum||!f)return;
  if(!f.elements.from.value){document.getElementById('wzLegal')?.remove();return}
  const empId=f.elements.empId.value,year=Number(f.elements.year.value),from=f.elements.from.value,to=f.elements.to.value||from;
  const g=leaveGrant(empId,year);if(!g)return;
  let days=[];try{days=leaveDays(from,to,g.weekdays,[],empId)}catch{return}
  const notes=[];
  const earlier=(S.leaveDecisions||[]).filter(x=>x.empId===empId&&Number(x.year)===year&&x.status==='issued');
  const longest=earlier.reduce((m,x)=>Math.max(m,(x.days||[]).length),0);
  if(days.length&&days.length<g.days&&days.length<10&&longest<10)
   notes.push('Ako se odmor koristi u dijelovima, <b>prvi dio mora trajati najmanje 10 radnih dana neprekidno</b> u toku kalendarske godine (čl. 85 st. 3). Ovo bi bio dio od '+days.length+' dana, a radnik još nema dio od 10 dana.');
  if(to>(year+1)+'-06-30')notes.push('Ostatak odmora za '+year+'. treba iskoristiti <b>najkasnije do 30.6.'+(year+1)+'.</b> (čl. 85 st. 3), osim zbog bolovanja ili porodiljskog odsustva (čl. 85 st. 4–5).');
  if(from.slice(0,4)<String(year))notes.push('Period počinje prije godine za koju se odobrava odmor.');
  let box=document.getElementById('wzLegal');
  if(!box){box=document.createElement('div');box.id='wzLegal';sum.after(box)}
  box.innerHTML=notes.length?'<div class="lv-sum" style="background:#fff7e6;color:#5c4300;margin-top:8px"><b>Zakonska provjera:</b><ul>'+notes.map(n=>'<li>'+n+'</li>').join('')+'</ul></div>':'';
 };
 // capture na nivou dokumenta: obrazac zaustavlja klikove u #modal, a provjera se izvršava poslije njegovog crtanja
 document.addEventListener('click',ev=>{if(ev.target.closest?.('#modal'))setTimeout(legalHints,0)},true);
 document.addEventListener('change',ev=>{if(ev.target.closest?.('#modal'))setTimeout(legalHints,0)},true);

 // 4) Upozorenje na stranici Godišnji odmori ako praznici nisu uneseni.
 const _lp=leavePage;
 leavePage=function(){
  const html=_lp(),y=Number(leaveYear),miss=missingStateHolidays(y);

 };
