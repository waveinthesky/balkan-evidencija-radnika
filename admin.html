function storeRead(){return new Promise((resolve,reject)=>{let tx=db.transaction('kv','readonly'),r=tx.objectStore('kv').get('main');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
function storeWrite(value){return new Promise((resolve,reject)=>{let tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(value,'main');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function save(){let snap=structuredClone(S);pendingPersist=pendingPersist.catch(()=>{}).then(async()=>{if(db)await storeWrite(snap);else localStorage.setItem('BALKAN_DATABASE',JSON.stringify(snap))});try{await pendingPersist}catch(e){alert('GREŠKA: Podaci nisu mogli biti sačuvani! '+e.message);throw e}}
async function init(){try{db=await newStore();S=await storeRead()}catch(e){db=null;try{S=JSON.parse(localStorage.getItem('BALKAN_DATABASE')||'null')}catch{S=null}}S||=defaultState();calLoc=S.station||'m1';adminLoc=calLoc;unlocked=!!(S.admin&&unlocked);if(!S.admin)route='setup';render()}
function audit(action,detail){S.audit.unshift({id:uid(),at:new Date().toISOString(),action,detail,by:'Administrator (lokalno)'});if(S.audit.length>5000)S.audit.length=5000}
function statusText(code){return LEGEND[code]?.[1]||'Nepoznato'}
function employeeAt(e,date){
 const from=e.hiredAt||'0000-01-01';
 let until=e.terminatedAt||'9999-12-31';
 // Privatni uvoz 2025 označava radnike koji u 2026 više nisu zaposleni.
 // Bez nagađanja tačnog datuma prestanka, za obračun su isključeni od 01.01.2026.
 if(e.inactiveBy2026===true&&until>='2026-01-01')until='2025-12-31';
 if(e.notActiveFrom&&date>=e.notActiveFrom)return false;
 return date>=from&&date<=until;
}
function locName(id){return S.locations.find(l=>l.id===id)?.name||'Nepoznat objekat'}
function getSchedule(locId,date){let loc=S.locations.find(l=>l.id===locId);return loc?.schedules?.filter(x=>x.from<=date).sort((a,b)=>b.from.localeCompare(a.from))[0]||null}
function isWorking(locId,date){let sc=getSchedule(locId,date);return sc?sc.days.includes(wd(date)):true}
function holiday(locId,date){return S.holidays.find(h=>h.date===date&&(!h.locationId||h.locationId===locId))}
function assigned(e,date){let a=(e.assignments||[{from:e.hiredAt||'1900-01-01',locationId:e.defaultLocationId}]).filter(a=>a.from<=date).sort((a,b)=>b.from.localeCompare(a.from))[0];return a?.locationId||e.defaultLocationId}
function dateOfEvent(at){let x=new Date(at);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`}
function evs(empId,locId,date){return S.events.filter(v=>v.empId===empId&&v.locId===locId&&dateOfEvent(v.at)===date).sort((a,b)=>a.at.localeCompare(b.at))}
function allEvents(empId){return S.events.filter(v=>v.empId===empId).sort((a,b)=>a.at.localeCompare(b.at))}
function eventsDay(empId,locId,date){let starts=evs(empId,locId,date).filter(e=>e.kind==='in'), full=allEvents(empId), outputs=[];let worked=0,open=false;for(let item of starts){let nextIn=full.find(x=>x.kind==='in'&&x.at>item.at),end=full.find(x=>x.kind==='out'&&x.locId===locId&&x.at>item.at&&(!nextIn||x.at<nextIn.at)&&minutesBetween(item.at,x.at)<=30*60);if(end){worked+=minutesBetween(item.at,end.at);outputs.push([item,end])}else{open=true;outputs.push([item,null])}}return{starts,outputs,worked:Math.round(worked),open}}
function override(empId,date,locId){return S.overrides.find(v=>v.empId===empId&&v.date===date&&v.locId===locId)}
function dayStatus(e,date,locId){if(!employeeAt(e,date))return 'F';let o=override(e.id,date,locId);if(o)return o.status;let z=eventsDay(e.id,locId,date);if(z.starts.length)return z.open&&date<today()?'RP':'P';let praznik=holiday(locId,date,e);if(praznik)return praznik.type==='religious'?'VH':'H';if(!isWorking(locId,date))return 'ND';if(date>=today())return 'F';return 'N'}
function employeeNames(locId,date){return S.employees.filter(e=>employeeAt(e,date)&&assigned(e,date)===locId)}
function monthEmployees(locId,y,m){let pref=ymd(y,m,1),last=ymd(y,m,new Date(y,m,0).getDate());return S.employees.filter(e=>{let from=e.hiredAt||'1900-01-01',to=e.terminatedAt||'9999-12-31';if(from>last||to<pref)return false;for(let day=1;day<=new Date(y,m,0).getDate();day++){let d=ymd(y,m,day);if(employeeAt(e,d)&&assigned(e,d)===locId)return true}return S.events.some(v=>v.empId===e.id&&v.locId===locId&&dateOfEvent(v.at).slice(0,7)===pref.slice(0,7))}).sort((a,b)=>a.name.localeCompare(b.name,'bs'))}
function monthMetrics(e,locId,y,m){let v={P:0,N:0,IA:0,GO:0,BO:0,ND:0,RP:0,H:0,VH:0,F:0,minutes:0};for(let i=1;i<=new Date(y,m,0).getDate();i++){let date=ymd(y,m,i);if(!employeeAt(e,date)||assigned(e,date)!==locId)continue;let s=dayStatus(e,date,locId);v[s]++;v.minutes+=eventsDay(e.id,locId,date).worked}return v}
function selections(locId){return S.locations.map(l=>`<option value="${esc(l.id)}" ${locId===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}
function nav(){return `<div class="nav">${[['pregled','▦ Pregled'],['kalendar','▦ Kalendar'],['radnici','♙ Radnici'],['objekti','▣ Objekti'],['odsustva','▤ Praznici i odsustva'],['izvjestaji','▥ Izvještaji'],['istorija','◷ Istorija'],['arhiva','▦ Arhiva 2025'],['postavke','⚙ Postavke']].map(([r,t])=>`<button class="tab ${route===r?'on':''}" data-route="${r}">${t}</button>`).join('')}</div>`}
function header(){return `<header class="top"><div class="brand"><div class="brand-mark">B</div><div><div class="brand-name">BALKAN <span class="desktop-only">– Evidencija zaposlenih</span></div><div class="subtitle">${unlocked&&route!=='kiosk'?'Administratorski pregled':'Prijava i odjava radnika'}</div></div></div><div class="top-actions"><span class="pill warning desktop-only">● Firebase – provjera veze</span>${unlocked?`<button class="btn small" data-route="pregled">Administracija</button><button class="btn small" data-route="kiosk">Skeniranje</button><button class="btn small" data-act="logout">Odjavi admina</button>`:`${S.admin?'<button class="btn small" data-act="login">🔒 Administracija</button>':''}`}</div></header>`}
function shell(content){return `<div class="shell">${header()}${content}<div class="footer">BALKAN · Zajednička evidencija · Firebase baza · Status veze prikazan gore</div></div>`}
function render(){if(!S)return;if(route!=='kiosk'&&route!=='setup'&&!unlocked)route='kiosk';let out;if(route==='setup')out=setupScreen();else if(route==='kiosk')out=kioskScreen();else out=`<div class="container">${nav()}${({pregled:overview,kalendar:calendar,radnici:workers,objekti:locations,odsustva:absences,izvjestaji:reports,istorija:history,arhiva:()=>`<div id="histContainer">${window.BALKAN_ARCHIVE?.display?.()||'Arhiva se učitava.'}</div>`,postavke:settings}[route]||overview)()}</div>`;$('app').innerHTML=shell(out);if(route==='kiosk')setTimeout(()=>$('barcode')?.focus(),30)}
function setupScreen(){return `<main class="kiosk"><div class="panel mainpanel"><div class="bigicon">🔐</div><h1>Prvo pokretanje</h1><p class="muted">Kreiraj administratorsku lozinku za ovu lokalnu instalaciju. Radnici ne trebaju lozinku.</p><form id="setupForm" class="grid" style="text-align:left"><div class="field"><label>Administratorska lozinka (najmanje 8 znakova)</label><input id="newpw" type="password" required minlength="8" autocomplete="new-password"></div><div class="field"><label>Ponovi lozinku</label><input id="newpw2" type="password" required minlength="8" autocomplete="new-password"></div><button class="btn primary" type="submit">Pokreni evidenciju</button></form><div class="note">Ovo je lokalna verzija. Lozinka štiti pristup administratorskom ekranu, ali ne zamjenjuje serversku zaštitu podataka.</div></div></main>`}
function kioskScreen(){let loc=S.locations.find(l=>l.id===S.station)||S.locations[0];return `<main class="kiosk"><div class="panel mainpanel"><div class="badge">${esc(loc?.name||'Objekat')}</div><div class="bigicon">▥</div><h1>Evidencija radnog vremena</h1><p class="muted">Izaberi dolazak ili odlazak, zatim skeniraj karticu zaposlenog.</p><div class="mode-select"><button data-act="mode-in" class="mode ${mode==='in'?'active in':''}">→ PRIJAVA</button><button data-act="mode-out" class="mode ${mode==='out'?'active out':''}">← ODJAVA</button></div><form id="scanForm"><div class="field" style="text-align:left"><label>Barkod radnika</label><input id="barcode" class="scanfield" placeholder="Skenirajte karticu" autocomplete="off" autofocus required></div><button class="btn primary" style="width:100%;margin-top:14px;padding:15px" type="submit">${mode==='in'?'Potvrdi dolazak':'Potvrdi odlazak'}</button></form><div id="scanresult">${toast?toast:''}</div><p class="smalltext" style="margin-top:22px">Kartica se prepoznaje samo dok je ovaj ekran otvoren i polje za barkod aktivno.</p></div><p class="smalltext" style="text-align:center">Skeniranje koristi vrijeme ovog računara. Službena online potvrda biće dostupna poslije povezivanja centralne baze.</p></main>`}
function pageTitle(title,sub,buttons=''){return `<div class="intro"><div><h1>${title}</h1><div class="muted">${sub}</div></div><div class="actionline">${buttons}</div></div>`}
function overview(){let d=today(),emp=employeeNames(adminLoc,d),present=emp.filter(e=>evs(e.id,adminLoc,d).some(x=>x.kind==='in')||override(e.id,d,adminLoc)?.status==='P').length,leave=emp.filter(e=>override(e.id,d,adminLoc)?.status==='GO').length,sick=emp.filter(e=>override(e.id,d,adminLoc)?.status==='BO').length,noCheck=emp.filter(e=>dayStatus(e,d,adminLoc)==='F'&&!evs(e.id,adminLoc,d).length&&!override(e.id,d,adminLoc)).length,incomplete=emp.filter(e=>{let z=eventsDay(e.id,adminLoc,d);return z.open}).length;let sc=getSchedule(adminLoc,d),openAlert='';if(sc&&sc.days.includes(wd(d))&&!holiday(adminLoc,d)&&minutes(`${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`)>minutes(sc.open)+Number(sc.grace||0)){let first=S.events.filter(x=>x.locId===adminLoc&&x.kind==='in'&&dateOfEvent(x.at)===d).sort((a,b)=>a.at.localeCompare(b.at))[0];if(!first)openAlert=`<div class="note">⚠ Nema prve prijave za danas. Podešeno otvaranje: ${esc(sc.open)}. Ovo <b>ne dokazuje</b> da objekat nije otvoren.</div>`;else if(minutes(clock(first.at))>minutes(sc.open)+Number(sc.grace||0))openAlert=`<div class="note">⚠ Prva evidentirana prijava: <b>${clock(first.at)}</b> (planirano otvaranje: <b>${esc(sc.open)}</b>). Ovo nije automatski kašnjenje pojedinog radnika.</div>`}
let rows=emp.map(e=>{let z=eventsDay(e.id,adminLoc,d),st=dayStatus(e,d,adminLoc),first=z.starts[0];return `<tr><td><b>${esc(e.name)}</b></td><td><span class="badge ${st}">${esc(statusText(st))}</span></td><td>${first?clock(first.at):'—'}</td><td>${z.outputs.filter(x=>x[1]).map(x=>clock(x[1].at)).join(', ')||'—'}</td><td><button class="btn small" data-day="${d}" data-emp="${e.id}" data-loc="${adminLoc}">Detalji</button></td></tr>`}).join('');return `${pageTitle('Pregled za danas',`Stvarna prijavljivanja radnika · ${dateTimeDisplay(new Date().toISOString())}`)}<div class="panel"><div class="toolbar"><div class="field"><label>Objekat</label><select data-field="adminLoc">${selections(adminLoc)}</select></div><button class="btn" data-route="kalendar">Otvori mjesečni kalendar →</button><button class="btn primary" data-act="manual">+ Ručna evidencija</button></div></div><div class="grid stats"><div class="stat green"><div class="cap">Prijavljeni danas</div><div class="num">${present}</div></div><div class="stat red"><div class="cap">Još bez prijave</div><div class="num">${noCheck}</div></div><div class="stat blue"><div class="cap">Na godišnjem</div><div class="num">${leave}</div></div><div class="stat"><div class="cap">Na bolovanju</div><div class="num">${sick}</div></div><div class="stat orange"><div class="cap">Otvorene prijave</div><div class="num">${incomplete}</div></div></div>${openAlert}<div class="panel"><div class="panel-head"><h2>Zaposleni – ${esc(locName(adminLoc))}</h2><span class="smalltext">${emp.length} radnika u evidenciji za današnji dan</span></div><div class="tablewrap"><table class="simpletable"><thead><tr><th>Radnik</th><th>Status</th><th>Dolazak</th><th>Odjava</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="list-empty">Nema zaposlenih. Dodaj radnika u administraciji.</td></tr>'}</tbody></table></div><p class="smalltext">"Još bez prijave" označava da trenutno nema skeniranja, ne da je radnik neopravdano odsutan.</p></div>`}
function calendar(){let n=new Date(calY,calM,0).getDate(),first=ymd(calY,calM,1),emps=monthEmployees(calLoc,calY,calM),loc=locName(calLoc);let heads=Array.from({length:n},(_,i)=>`<th>${i+1}<br><span style="font-weight:400">${WEEK[wd(ymd(calY,calM,i+1))]}</span></th>`).join(''),body=emps.map(e=>{let v=monthMetrics(e,calLoc,calY,calM);return `<tr><td class="name">${esc(e.name)}</td>${Array.from({length:n},(_,i)=>{let date=ymd(calY,calM,i+1),status=dayStatus(e,date,calLoc);return `<td><button title="${esc(statusText(status))} – ${esc(e.name)} – ${date}" class="cell ${status} ${chosenDate===date&&chosenEmp===e.id?'selected':''}" data-day="${date}" data-emp="${e.id}" data-loc="${calLoc}">${LEGEND[status][0]}</button></td>`}).join('')}<td class="total">${v.P+v.RP}</td></tr>`}).join('');let selected=S.employees.find(e=>e.id===chosenEmp);return `${pageTitle('Mjesečni kalendar','Brzi pregled svih zaposlenih i svih dana u mjesecu',`<button class="btn" data-act="exportcsv">↓ Excel (CSV)</button><button class="btn" data-act="print">⎙ Štampaj / PDF</button><button class="btn primary" data-act="manual">+ Dodaj ručno</button>`)}<div class="panel"><div class="toolbar"><div class="field"><label>Objekat</label><select data-field="calLoc">${selections(calLoc)}</select></div><div class="field"><label>Godina</label><input type="number" data-field="calY" min="2000" max="2100" value="${calY}"></div><div class="field"><label>Mjesec</label><select data-field="calM">${MONTHS.map((m,i)=>`<option value="${i+1}" ${calM===i+1?'selected':''}>${m}</option>`).join('')}</select></div><button class="btn" data-act="prevmonth">‹ Prethodni</button><button class="btn" data-act="nextmonth">Sljedeći ›</button></div></div><div class="two-col"><section class="panel" style="min-width:0"><div class="panel-head"><h2>${MONTHS[calM-1]} ${calY}. · ${esc(loc)}</h2><span class="smalltext">${emps.length} zaposlenih</span></div><div class="tablewrap"><table class="calendar"><thead><tr><th class="name">Radnik</th>${heads}<th>Rad.</th></tr></thead><tbody>${body||`<tr><td colspan="${n+2}" class="list-empty">Nema radnika za odabrani period.</td></tr>`}</tbody></table></div><div class="legend">${Object.entries(LEGEND).map(([k,v])=>`<span><b style="background:var(--${({P:'greenp',N:'redp',GO:'bluep',BO:'purplep',ND:'grayp',RP:'orangep',H:'bluep',F:'grayp'})[k]})"></b>${esc(v[1])}</span>`).join('')}</div><div class="note info">Crvena znači <b>nema prijave</b> na protekli radni dan, ne automatski neopravdan izostanak. Nepotpuna odjava je narandžasta.</div></section><aside class="panel" id="dayPanel">${selected?dayPanel(selected,chosenDate,calLoc):`<h2>Brzi detalji</h2><p class="muted">Klikni na obojeno polje u kalendaru da vidiš radnika, datum, tačno vrijeme prijave i odjave i mogućnost ispravke.</p>`}</aside></div>`}
function dayPanel(e,date,locId){let code=dayStatus(e,date,locId),z=eventsDay(e.id,locId,date),o=override(e.id,date,locId),sc=getSchedule(locId,date),late=null;if(z.starts.length&&sc&&isWorking(locId,date)){let diff=minutes(clock(z.starts[0].at))-minutes(sc.open);if(diff>Number(sc.grace||0))late=diff}let evRows=evs(e.id,locId,date).map(v=>`<div style="display:flex;align-items:center;gap:7px;justify-content:space-between;border-bottom:1px solid #edf1f8;padding:8px 0"><span>${v.kind==='in'?'→ Dolazak':'← Odlazak'} · <b>${clock(v.at)}</b> <span class="smalltext">${v.source==='manual'?'(ručno)':'(barkod)'}</span></span><button class="btn small danger" data-del-event="${v.id}">✕</button></div>`).join('');return `<h2>Brzi detalji</h2><h3>${esc(e.name)}</h3><span class="smalltext">${date.split('-').reverse().join('.')} · ${esc(locName(locId))}</span><div class="detail-rows"><div>Status</div><div class="value"><span class="badge ${code}">${esc(statusText(code))}</span></div><div>Prva prijava</div><div class="value">${z.starts.length?clock(z.starts[0].at):'—'}</div><div>Potvrđena odjava</div><div class="value">${z.outputs.some(x=>x[1])?z.outputs.filter(x=>x[1]).map(x=>clock(x[1].at)).join(', '):'—'}</div><div>Potvrđeni sati</div><div class="value">${z.starts.length&&z.outputs.every(x=>x[1])?humanMinutes(z.worked):'—'}</div><div>Radno vrijeme objekta</div><div class="value">${sc?esc(sc.open+'–'+sc.close):'Nije podešeno'}</div></div>${late!=null?`<div class="note">Prva prijava je ${late} min nakon vremena otvaranja objekta. To ne dokazuje individualno kašnjenje.</div>`:''}${z.open?`<div class="note">${date<today()?'Nedostaje odjava. Ne obračunavamo nepoznate sate.':'Prijava je još otvorena.'}</div>`:''}${o?`<div class="note info">Ručna oznaka: ${esc(statusText(o.status))}. ${esc(o.note||'')}</div>`:''}<h3 style="margin-top:18px">Skeniranja</h3>${evRows||'<p class="smalltext">Nema zabilježenih skeniranja.</p>'}<div class="actionline" style="margin-top:18px"><button class="btn primary" data-act="manual" data-man-emp="${e.id}" data-man-date="${date}" data-man-loc="${locId}">+ Ispravi / dodaj</button><button class="btn" data-worker-history="${e.id}">Istorija radnika</button></div>`}
function workers(){return `${pageTitle('Radnici','Zaposleni, barkodovi i pripadnost objektima',`<button class="btn primary" data-act="add-worker">+ Dodaj radnika</button>`)}<div class="panel"><div class="tablewrap"><table class="simpletable"><thead><tr><th>Ime i prezime</th><th>Barkod</th><th>Objekat</th><th>Status</th><th>Radni odnos</th><th>Opcije</th></tr></thead><tbody>${S.employees.slice().sort((a,b)=>a.name.localeCompare(b.name,'bs')).map(e=>`<tr><td><b>${esc(e.name)}</b></td><td><code>${esc(e.barcode)}</code></td><td>${esc(locName(e.defaultLocationId))}</td><td><span class="badge ${e.active?'P':'ND'}">${e.active?'Aktivan':'Deaktiviran'}</span></td><td>${esc(e.hiredAt||'—')} ${e.terminatedAt?'→ '+esc(e.terminatedAt):''}</td><td><div class="actionline"><button class="btn small" data-edit-worker="${e.id}">Uredi</button><button class="btn small" data-print-card="${e.id}">Kartica</button><button class="btn small" data-worker-history="${e.id}">Evidencija</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="list-empty">Nema radnika. Klikni „Dodaj radnika“.</td></tr>'}</tbody></table></div></div>`}

function absences(){return `${pageTitle('Praznici i odsustva','Evidentiranje godišnjeg, bolovanja, neradnih dana i praznika',`<button class="btn primary" data-act="manual">+ Evidencija radnika</button><button class="btn" data-act="add-holiday">+ Praznik</button>`)}<div class="panel"><h2>Praznici i posebni dani</h2><div class="tablewrap"><table class="simpletable"><thead><tr><th>Datum</th><th>Naziv</th><th>Primjena</th><th></th></tr></thead><tbody>${S.holidays.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(h=>`<tr><td>${esc(h.date)}${h.endDate&&h.endDate!==h.date?' → '+esc(h.endDate):''}</td><td>${esc(h.label)}<br><small>${h.type==='religious'?'Vjerski':h.type==='state'?'Državni':'Posebni / stariji unos'}</small></td><td>${h.employeeId?esc(S.employees.find(e=>e.id===h.employeeId)?.name||'Radnik'):(h.locationId?esc(locName(h.locationId)):'Svi objekti')}</td><td><button class="btn small" data-edit-holiday="${h.id}">Uredi</button> <button class="btn small danger" data-del-holiday="${h.id}">Ukloni</button></td></tr>`).join('')||'<tr><td colspan="4" class="list-empty">Nema unesenih praznika.</td></tr>'}</tbody></table></div><div class="note info">Plaćeni praznik se računa samo kada je označena kućica za plaćeno odsustvo, na radni dan prema rasporedu i normi sati. Posebno se prikazuje od stvarnog rada.</div></div>`}

irstEnd" type="text" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="HH:MM" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" title="Vrijeme 00:00–23:59 (bez AM/PM), npr. 14:30" value="${esc(sc?.firstEnd||'')}"></div><div class="field"><label>Druga smjena – početak (24h)</label><input name="secondStart" type="text" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="HH:MM" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" title="Vrijeme 00:00–23:59 (bez AM/PM), npr. 14:30" value="${esc(sc?.secondStart||'')}"></div><div class="field"><label>Druga smjena – završetak (24h)</label><input name="secondEnd" type="text" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="HH:MM" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" title="Vrijeme 00:00–23:59 (bez AM/PM), npr. 14:30" value="${esc(sc?.secondEnd||'')}"></div></div><div class="note info">Radnik sa automatskim režimom prati otvaranje objekta prema datumu. Prva smjena prati otvaranje ako nema posebno podešen početak; za drugu smjenu podesi njen početak. Za noćne smjene koje prelaze ponoć potrebno je posebno podešavanje.</div><div class="field"><label>Radni dani objekta</label><div class="weekdays">${[1,2,3,4,5,6,0].map(i=>`<label class="weekday"><input type="checkbox" name="day${i}" ${days.includes(i)?'checked':''}>${WEEK[i]}</label>`).join('')}</div></div><div class="note info">Stare postavke ostaju u istoriji. Novi raspored važi od odabranog datuma, uključujući i ako se unese promjena za raniji datum.</div>${l?`<h3>Historija promjena</h3><div class="tablewrap"><table class="simpletable"><thead><tr><th>Važi od</th><th>Otvaranje</th><th>Zatvaranje</th><th>Prva smjena</th><th>Druga smjena</th></tr></thead><tbody>${l.schedules.slice().sort((a,b)=>b.from.localeCompare(a.from)).map(s=>`<tr><td>${s.from}</td><td>${s.open}</td><td>${s.close}</td><td>${esc(s.firstStart||'—')}–${esc(s.firstEnd||'—')}</td><td>${esc(s.secondStart||'—')}–${esc(s.secondEnd||'—')}</td></tr>`).join('')}</tbody></table></div>`:''}<div class="modalfoot"><button class="btn" type="button" data-act="close-modal">Odustani</button><button type="submit" class="btn primary">Sačuvaj</button></div></form>`)}

async function hashPass(pass,salt){if(!crypto?.subtle)throw Error('Ovaj preglednik ne podržava sigurno podešavanje lozinke. Otvori u novijem Chromeu.');let key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);let b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(salt),iterations:170000,hash:'SHA-256'},key,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function createAdmin(p){let salt=Array.from(crypto.getRandomValues(new Uint8Array(16)));S.admin={salt,hash:await hashPass(p,salt)};await save();route='kiosk';render()}

async function scan(code){code=code.trim();let e=S.employees.find(x=>x.barcode.toLowerCase()===code.toLowerCase()&&x.active);if(!e){scanFeedback('err','Kartica nije prepoznata. Obratite se administratoru.');return}let now=new Date().toISOString(),locId=S.station;if(!employeeAt(e,today())){scanFeedback('err','Radnik nije aktivan na ovaj datum.');return}let recent=S.events.filter(v=>v.empId===e.id&&v.locId===locId).sort((a,b)=>b.at.localeCompare(a.at))[0];if(recent&&minutesBetween(recent.at,now)<1){scanFeedback('warn','Kartica je upravo skenirana – pokušaj duplog skeniranja je zaustavljen.');return}if(mode==='out'){let arr=allEvents(e.id),last=arr[arr.length-1];if(!last||last.kind!=='in'||last.locId!==locId){scanFeedback('err','Nema otvorene prijave ovog radnika u ovom objektu. Administrator može izvršiti ispravku.');return}}else{let arr=allEvents(e.id),last=arr[arr.length-1];if(last?.kind==='in'){scanFeedback('warn',`Radnik ${e.name} već ima otvorenu prijavu. Prvo je potrebno evidentirati odjavu.`);return}}S.events.push({id:uid(),empId:e.id,locId,kind:mode,at:now,source:'barcode'});await save();scanFeedback('ok',`${esc(e.name)} · ${mode==='in'?'DOLAZAK':'ODLAZAK'} potvrđen u ${clock(now)} · ${esc(locName(locId))}`)}

// ===== EAN-13 (isti standard kao barkodovi artikala; svaki prodavnički skener ga čita) =====
const EAN_L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const EAN_R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const EAN_PARITY=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function ean13Check(d12){let s=0;for(let i=0;i<12;i++)s+=Number(d12[i])*(i%2?3:1);return String((10-s%10)%10)}
function isEan13(code){const c=String(code||'').trim();return /^\d{13}$/.test(c)&&ean13Check(c.slice(0,12))===c[12]}
function ean13Modules(code){
 const c=String(code),p=EAN_PARITY[Number(c[0])];let m='101';
 for(let i=1;i<=6;i++)m+=(p[i-1]==='L'?EAN_L:EAN_G)[Number(c[i])];
 m+='01010';
 for(let i=7;i<=12;i++)m+=EAN_R[Number(c[i])];
 return m+'101';
}
// Fizička veličina: 46 mm širine (≈ 0,41 mm po modulu, 123 % standarda), s bijelom zonom 11/7 modula.
function makeEan13(code,widthMm=46){
 if(!isEan13(code))return '';
 const c=String(code).trim(),mods=ean13Modules(c),qL=11,qR=7,total=qL+mods.length+qR;
 const barH=60,guardH=66,font=9.5,H=guardH+font+2;
 const guard=i=>i<3||(i>=45&&i<50)||i>=92;
 let rects='',i=0;
 while(i<mods.length){
  if(mods[i]==='1'){let j=i;while(j<mods.length&&mods[j]==='1'&&guard(j)===guard(i))j++;
   rects+='<rect x="'+(qL+i)+'" y="0" width="'+(j-i)+'" height="'+(guard(i)?guardH:barH)+'" fill="#000"/>';i=j}
  else i++;
 }
 const txt=(s,x,anchor)=>'<text x="'+x+'" y="'+(guardH+font-1)+'" text-anchor="'+anchor+'" font-family="Arial,Helvetica,sans-serif" font-size="'+font+'" letter-spacing="1.3">'+s+'</text>';
 const digits=txt(c[0],qL-2,'end')+txt(c.slice(1,7),qL+3+21,'middle')+txt(c.slice(7),qL+50+21,'middle');
 const hMm=(widthMm*H/total).toFixed(1);
 return '<svg class="ean13" viewBox="0 0 '+total+' '+H+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" style="display:block;margin:0 auto;width:'+widthMm+'mm;height:'+hMm+'mm;max-width:100%" aria-label="Barkod EAN-13 '+c+'"><rect width="100%" height="100%" fill="#fff"/>'+rects+digits+'</svg>';
}
function newEan13(used){
 // Prefiks 29 = GS1 raspon za internu upotrebu: ne sudara se s kodovima stvarnih artikala.
 for(let n=0;n<50;n++){
  const r=new Uint32Array(2);crypto.getRandomValues(r);
  const body='29'+String(r[0]%100000).padStart(5,'0')+String(r[1]%100000).padStart(5,'0');
  const code=body+ean13Check(body);
  if(!used||!used.has(code)){used?.add(code);return code}
 }

}

let persistedBaseline=null, syncBusy=false, syncWake=null, suppressDiff=false, syncLastError='';
function ensureV2(){
 if(!S._sync)S._sync={url:'',token:'',deviceId:uid(),seeded:false,lastAt:null};
 if(!Array.isArray(S._pending))S._pending=[];
 if(!Array.isArray(S._localBackups))S._localBackups=[];
 for(const key of SYNC_NAMES)if(!Array.isArray(S[key]))S[key]=[];
}
function diffRecords(prev,next){
 const ops=[];
 for(const col of SYNC_NAMES){
   const old=new Map((prev?.[col]||[]).map(x=>[x.id,JSON.stringify(x)]));
   const now=new Map((next[col]||[]).map(x=>[x.id,JSON.stringify(x)]));
   for(const [id,value] of now)if(old.get(id)!==value)ops.push({id:uid(),collection:col,key:id,type:'set',value:JSON.parse(value)});
   for(const [id] of old)if(!now.has(id))ops.push({id:uid(),collection:col,key:id,type:'delete'});
 }
 return ops;
}
function saveLocalSnapshot(){
 const date=today(),last=S._localBackups[0];
 if(last?.date===date)return;
 // Automatska lokalna kopija se čuva u istom pregledniku. Ne zamjenjuje vanjsku kopiju.
 const data={...S};delete data._pending;delete data._localBackups;delete data._sync;
 S._localBackups.unshift({date,at:new Date().toISOString(),data:structuredClone(data)});
 S._localBackups=S._localBackups.slice(0,7);
}
const v1save=save;
save=async function(){
 ensureV2();
 if(!suppressDiff&&persistedBaseline){
   const changes=diffRecords(persistedBaseline,S);
   for(const op of changes){
     // Stvarna skeniranja već su pojedinačno evidentirana. Za ručne izmjene čuvamo prije/poslije.
     if(op.collection==='audit'||(op.collection==='events'&&op.type==='set'&&op.value?.source==='barcode'))continue;
     // Brisanja kroz "Brisanje skeniranja" već imaju potpunu kopiju u korpi (scanTrash) i jedan sažeti zapis.
     if(op.collection==='scanTrash'||(op.type==='delete'&&(op.collection==='events'||op.collection==='overrides')&&(S.scanTrash||[]).some(b=>!b.restoredAt&&((b.events||[]).some(v=>v.id===op.key)||(b.overrides||[]).some(o=>o.id===op.key)))))continue;
     const before=(persistedBaseline[op.collection]||[]).find(v=>v.id===op.key)||null;
     const after=op.type==='delete'?null:op.value;
     const describe=(v)=>v==null?'(nema)':JSON.stringify(v).slice(0,650);
     audit('Promjena / prije-poslije',`${op.collection} ${op.key} | PRIJE ${describe(before)} | POSLIJE ${describe(after)}`);
   }
   S._pending.push(...diffRecords(persistedBaseline,S));
 }
 saveLocalSnapshot();
 await v1save();
 persistedBaseline=structuredClone(S);
 if(S._sync.url && S._sync.token)queueSync();
};

function syncStatus(){
 ensureV2();let pending=S._pending.length,enabled=!!(S._sync.url&&S._sync.token);
 if(!enabled)return '<div class="sync-banner bad">⚠ Ovaj računar radi lokalno. Centralna sinhronizacija još nije podešena.</div>';
 return `<div class="sync-banner ${pending||syncLastError||!S._sync.lastAt?'bad':'good'}">${syncBusy?'⟳ U toku sinhronizacija…':pending?'⚠ Čeka sinhronizaciju':S._sync.lastAt?'✓ Lokalno usklađeno sa serverom':'⚠ Čeka prvu potvrdu servera'} · Neposlano: <b>${pending}</b> · Posljednja potvrda: <b>${S._sync.lastAt?dateTimeDisplay(S._sync.lastAt):'još nije potvrđeno'}</b>${syncLastError?' · Greška: '+esc(syncLastError):''}</div>`;

function queueSync(delay=1200){if(syncWake)clearTimeout(syncWake);syncWake=setTimeout(()=>{syncWake=null;syncNow()},delay)}
function bootstrapOps(){
 if(S._sync.seeded)return;
 const queued=new Set(S._pending.filter(o=>o.type==='set').map(o=>o.collection+':'+o.key));
 for(const col of SYNC_NAMES)for(const v of S[col]||[])if(!queued.has(col+':'+v.id))S._pending.push({id:uid(),collection:col,key:v.id,type:'seed',value:structuredClone(v)});
 S._sync.seeded=true;
}
function normalizeSyncUrl(url){
 url=url.trim().replace(/\/+$/,'');
 const u=new URL(url);
 if(u.protocol!=='https:'&&!(u.protocol==='http:'&&['localhost','127.0.0.1'].includes(u.hostname)))throw Error('Za drugi računar koristi HTTPS adresu servera. HTTP dozvoljen samo lokalno.');
 return url;
}
async function syncNow(){
 if(syncBusy||!S?._sync?.url||!S._sync.token||!navigator.onLine)return;
 syncBusy=true;syncLastError='';
 try{
   bootstrapOps();
   let sent=S._pending.slice();
   await v1save();persistedBaseline=structuredClone(S);
   const res=await fetch(S._sync.url+'/api/sync',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S._sync.token},body:JSON.stringify({deviceId:S._sync.deviceId,ops:sent}),cache:'no-store',signal:AbortSignal.timeout(12000)});
   if(!res.ok)throw Error('Server: HTTP '+res.status);
   const response=await res.json();
   if(!response.ok||!response.state)throw Error('Odgovor servera nije ispravan.');
   // Ne gubimo izmjene koje su nastale za vrijeme slanja zahtjeva.
   const sentIds=new Set(sent.map(op=>op.id));
   const remaining=S._pending.filter(op=>!sentIds.has(op.id));
   const next=structuredClone(S);
   for(const col of SYNC_NAMES){
     const byId=new Map((response.state[col]||[]).map(v=>[v.id,v]));
     for(const op of remaining.filter(v=>v.collection===col)){
       if(op.type==='delete')byId.delete(op.key);
       else if(op.type==='set')byId.set(op.key,op.value);
       else if(op.type==='seed'&&!byId.has(op.key))byId.set(op.key,op.value);
     }
     next[col]=[...byId.values()];
   }
   next._pending=remaining;next._sync.lastAt=new Date().toISOString();
   S=next;
   await v1save();persistedBaseline=structuredClone(S);
   if(remaining.length)queueSync(1200);
   if(route!=='kiosk'&&route!=='setup')render();
 }catch(e){syncLastError=e.message; if(route==='postavke')render();}
 finally{syncBusy=false;}
}

function annualEmployeeCard(id,year=new Date().getFullYear()){

    while(nodes.length>original.length){body.removeChild(nodes.pop())}

      textNodes.forEach(t=>t.textContent='');

    }

function v4OriginalPrintableHtml(d,jmb=''){
  const lines=originalPreviewParagraphs(d,jmb);
  const css=`@page{size:A4;margin:17.52mm 23.37mm 12.7mm 25mm}*{box-sizing:border-box}body{background:#e8edf3;margin:0;font-family:Arial,sans-serif;color:#111}.actions{padding:14px;display:flex;align-items:center;gap:12px;justify-content:center;background:#182d49;color:#fff;position:sticky;top:0}.actions button{background:#1f71c9;color:white;border:0;border-radius:7px;padding:11px 18px;font:600 14px Arial;cursor:pointer}.actions small{font-size:11px;color:#d0ddeb}.sheet{width:210mm;min-height:297mm;background:#fff;padding:17.52mm 23.37mm 12.7mm 25mm;margin:15px auto;box-shadow:0 5px 30px #15344a38;font:10pt/1.12 Arial,sans-serif}.sheet p{margin:0 0 3mm;white-space:pre-wrap}.sheet .head{margin-bottom:11mm;text-align:justify}.sheet .heading{text-align:center;font-weight:bold;font-size:11pt;margin-bottom:7mm}.sheet .intro{margin-bottom:5mm;text-align:justify}.sheet .ital{font-style:italic;text-align:justify;margin-bottom:1mm}.sheet .bold{font-weight:bold}.sheet .bullet{padding-left:14mm;font-style:italic;margin-bottom:0}.sheet .numbered{padding-left:6mm;font-style:italic;margin-bottom:0}.sheet .body{margin:5mm 0}.sheet .notice{margin:7mm 0}.sheet .sign{text-align:right;margin:10mm 4mm 13mm 0}.sheet .footer{font-size:9pt}.print-note{color:#a1b5d0}@media print{body{background:white}.actions{display:none}.sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none;page-break-after:auto}}`;
  const para=(s,i)=>{
    if(i===0)return `<p class="head">${esc(s)}</p>`;
    if(i===3)return `<p class="heading">${esc(s)}</p>`;
    if(i===5)return `<p class="intro">${esc(s)}</p>`;
    if(i>=7&&i<=10)return `<p class="ital">${esc(s)}</p>`;
    if(i>=12&&i<=20){let prefix='';if(i===13)prefix='1.  ';if(i===18)prefix='2.  ';if(i===20)prefix='3.  ';if([14,15,16,17,19].includes(i))prefix='•  ';
      return `<p class="${i===12?'ital':([14,15,16,17,19].includes(i)?'bullet':'numbered')}">${esc(prefix+s)}</p>`;
    }
    if(i===22)return `<p class="body">${esc(s)}</p>`;
    if(i===24)return `<p class="notice">${esc(s)}</p>`;
    if(i===32||i===36)return `<p class="sign">${esc(s)}</p>`;
    if(i>=37)return `<p class="footer">${esc(s)}</p>`;
    if(!s.trim())return '<p style="margin:0 0 2mm">&nbsp;</p>';
    return `<p>${esc(s)}</p>`;
  };
  return '<!DOCTYPE html><html lang="bs"><head><meta charset="utf-8"><title>Rješenje '+esc(d.number)+' – '+esc(d.employeeName)+'</title><style>'+css+'</style></head><body><div class="actions"><b>Rješenje '+esc(d.number)+'</b><button onclick="window.print()">⎙ Štampaj ponovo</button><small>Broj kopija bira se u dijalogu štampe. Ponovna štampa ne mijenja evidenciju.</small></div><div class="sheet">'+lines.map(para).join('')+'</div></body></html>';
}

};

// V5: opcionalni Authenticator (TOTP) i brzo osvježavanje centralne baze.
// Tajni TOTP ključevi nikada se ne čuvaju u HTML-u ili na radničkom terminalu.
let v5Config={policies:{},enrolled:[],individual:{}},v5ConfigAt=0,v5PendingBarcode='',v5EnrollId='';
function v5Ensure(){S._security ||= {terminalToken:''};}
function v5Server(){return S?._sync?.url||''}
function v5AdminKey(){return sessionStorage.getItem('balkan_admin_api_key')||''}
async function v5Api(path,body,role='terminal',method='POST'){
  if(!v5Server())throw Error('Prvo podesi centralni server u Administracija → Postavke.');
  v5Ensure();const token=role==='admin'?v5AdminKey():S._security.terminalToken;
  if(!token)throw Error(role==='admin'?'Unesi administratorski API ključ u Postavkama.':'Unesi ključ terminala u Postavkama.');
  const response=await fetch(v5Server()+path,{method,headers:{'Authorization':'Bearer '+token,...(method==='POST'?{'Content-Type':'application/json'}:{})},...(method==='POST'?{body:JSON.stringify(body||{})}:{}),signal:AbortSignal.timeout(8000),cache:'no-store'});
  const result=await response.json().catch(()=>({error:'Neispravan odgovor servera'}));
  if(!response.ok||!result.ok)throw Error(result.error||'Greška HTTP '+response.status);
  return result;
}
async function v5RefreshConfig(force=false){
 if(!force&&Date.now()-v5ConfigAt<12000)return v5Config;
 const result=await v5Api('/api/security/config',null,'terminal','GET');
 v5Config={policies:result.policies||{},enrolled:result.enrolled||[],individual:result.individual||{}};
 v5ConfigAt=Date.now();S._security.lastPolicies=v5Config.policies;S._security.lastIndividual=v5Config.individual;return v5Config;
}
function v5Requires(e){const m=v5Config.policies[S.station]||'off';return m==='all'||(m==='individual'&&!!v5Config.individual[e.id]);}
const v5OldScan=scan;
scan=async function(barcode){
 const worker=S.employees.find(x=>x.barcode.toLowerCase()===String(barcode).trim().toLowerCase()&&x.active);
 if(!worker)return v5OldScan(barcode);
 v5Ensure();
 // Ako je backend konfigurisan, njegova aktuelna politika ima prednost nad lokalnim ekranom.
 if(v5Server()&&navigator.onLine&&!S._security.terminalToken)return scanFeedback('err','Potreban je ključ radničkog terminala. Administrator treba završiti podešavanje.');
 if(v5Server()&&S._security.terminalToken&&navigator.onLine){
   try{await v5RefreshConfig(true)}catch(err){
     scanFeedback('warn','Sigurnosna pravila nisu dostupna: '+esc(err.message)+'. Obrati se administratoru.');return;
   }
   if(v5Requires(worker)){
      if(!v5Config.enrolled.includes(worker.id))return scanFeedback('err','Telefon nije povezan s radnikom. Obrati se administratoru.');
      v5PendingBarcode=barcode;
      modal('Potvrda prijave',`<div class="note info"><b>${esc(worker.name)}</b> · ${esc(mode==='in'?'Dolazak':'Odlazak')}<br>Otvorite Google Authenticator na svom telefonu.</div><form id="v5CodeForm" class="grid"><div class="field"><label>Šestocifreni kod</label><input name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autofocus autocomplete="one-time-code" placeholder="000000"></div><div class="modalfoot"><button type="button" class="btn" data-act="close-modal">Odustani</button><button class="btn primary" type="submit">Potvrdi ${mode==='in'?'dolazak':'odlazak'}</button></div></form>`);
      return;
   }
   return v5ServerScan(barcode,'');
 }
 // Bez servera isključena zaštita znači stari offline sken; kada je posljednja politika
 // zahtijevala kod, NE izmišljamo potvrdu offline.
 if(v5Server()){
    const p=S._security?.lastPolicies?.[S.station];
    if(p===undefined||p==='all'||(p==='individual'&&S._security?.lastIndividual?.[worker.id])){
       return scanFeedback('err','Bez interneta ne mogu pouzdano potvrditi pravilo prijave. Obrati se administratoru.');
    }
 }
 if(v5Requires(worker))return scanFeedback('err','Za ovu prijavu potreban je telefon i veza sa serverom. Obrati se administratoru.');
 return v5OldScan(barcode);
};
async function v5ServerScan(barcode,code){
 const r=await v5Api('/api/attendance/scan',{barcode,kind:mode,locId:S.station,code});
 if(!S.events.some(x=>x.id===r.event.id))S.events.push(r.event);
 await save();
 queueSync(100);
 scanFeedback('ok',`${esc(S.employees.find(x=>x.id===r.event.empId)?.name||'Radnik')} · ${mode==='in'?'DOLAZAK':'ODLAZAK'} potvrđen u ${clock(r.event.at)} · ${esc(locName(S.station))}`);
}

 }
 if(task==='individual-on'||task==='individual-off'){

function shiftInfo(employee,date,locId){
 const location=locId||assigned(employee,date),schedule=getSchedule(location,date);
 const dayMode=employee.shiftByDate?.[date];
 const selected=dayMode&&dayMode!=='inherit'?dayMode:employee.defaultShift||'';
 const manual=employee.shiftCalendar?.[date]||'';
 if(dayMode==='custom'&&manual)return {start:manual,end:'',label:'Posebna smjena'};
 if(selected==='first'&&schedule?.open)return {start:schedule.firstStart||schedule.open,end:schedule.firstEnd||'',label:'Prva smjena'};
 if(selected==='second'&&schedule?.secondStart)return {start:schedule.secondStart,end:schedule.secondEnd||'',label:'Druga smjena'};
 if(manual)return {start:manual,end:'',label:'Pojedinačna smjena'};
 if(selected==='custom')return {start:employee.shiftStart||'',end:'',label:employee.shiftStart?'Posebna smjena':'Posebna smjena nije podešena'};
 if(selected==='second')return {start:'',end:'',label:'Druga smjena nije podešena u objektu'};
 // Starije kartice: ako sacuvani sat odgovara nekadasnjem objektu ili smjeni,
 // pratimo sezonu. Stvarno razliciti pojedinacni termini ostaju sacuvani.
 if(!selected&&employee.shiftStart){
  const old=S.locations.find(l=>l.id===location)?.schedules?.filter(x=>x.from<=date)||[];
  if(old.some(x=>x.secondStart===employee.shiftStart)&&schedule?.secondStart)
   return {start:schedule.secondStart,end:schedule.secondEnd||'',label:'Naslijedjena druga smjena'};
  if(old.some(x=>x.firstStart===employee.shiftStart&&x.firstStart!==x.open)&&schedule?.firstStart)
   return {start:schedule.firstStart,end:schedule.firstEnd||'',label:'Naslijedjena prva smjena'};
  if(old.some(x=>x.open===employee.shiftStart||x.firstStart===employee.shiftStart&&x.firstStart===x.open)&&schedule?.open)
   return {start:schedule.open,end:schedule.close||'',label:'Automatski · objekat'};
  return {start:employee.shiftStart,end:'',label:'Ranije upisan poseban početak'};
 }
 if(!selected&&schedule?.open)return {start:schedule.open,end:schedule.close||'',label:'Automatski · objekat'};
 return {start:'',end:'',label:'Radno vrijeme objekta nije podešeno'};
}
function plannedStart(employee,date,locId){return shiftInfo(employee,date,locId).start}
function tardiness(employee,date,locId){
 const z=eventsDay(employee.id,locId,date),scheduled=plannedStart(employee,date,locId),sc=getSchedule(locId,date);
 if(!z.starts.length||!scheduled||!sc||!isWorking(locId,date)||holiday(locId,date,employee))return null;
 return Math.max(0,minutes(clock(z.starts[0].at))-minutes(scheduled)-Number(sc.grace||0));
}
function reportFigures(employee,locId,dates){
 let actual=0,paid=0,late=0,lateDays=0,holidays=0,unclosed=0,unconfigured=0,normDefault=0,holidayWork=0,holidayWorkDays=0;
 for(const date of dates){
  if(!employeeAt(employee,date)||assigned(employee,date)!==locId)continue;
  const z=eventsDay(employee.id,locId,date),sc=getSchedule(locId,date),status=dayStatus(employee,date,locId);
  actual+=z.worked;if(z.open)unclosed++;
  const d=tardiness(employee,date,locId);if(d!=null&&d>0){late+=d;lateDays++}
  const hol=holiday(locId,date,employee);
  if((status==='H'||status==='VH')&&hol?.paid===true&&!z.starts.length&&isWorking(locId,date)&&sc){
   // Naknada zarade za praznik "kao da je na radu" (čl. 102 Zakona o radu). Ako norma nije unesena,
   // koristi se zakonsko puno radno vrijeme: 40 h sedmično / broj radnih dana objekta (čl. 61).
   holidays++;
   let hours=Number(employee.paidHours||sc.paidHours||0);
   if(!(hours>0)){hours=40/Math.max(1,(sc.days||[1,2,3,4,5]).length);normDefault++}
   paid+=Math.round(hours*60);
  }
  // Rad na dan praznika: stvarni sati se računaju normalno, a zarada se uvećava (čl. 89 st. 2, čl. 98).
  if(hol?.paid===true&&isWorking(locId,date)&&z.starts.length){holidayWork+=z.worked;holidayWorkDays++}
 }
 return{actual,paid,total:actual+paid,late,lateDays,holidays,unclosed,unconfigured,normDefault,holidayWork,holidayWorkDays}
}

function yearLeaveSummary(e,year){
 const g=leaveGrant(e.id,year);
 const quotaRaw=g?.days??e.leaveQuotaByYear?.[year],quota=quotaRaw==null?null:Number(quotaRaw);
 const carryRaw=e.leaveCarryByYear?.[year];
 const archiveCarry=year===2026&&carryRaw==null?window.BALKAN_ARCHIVE?.getCarryover?.(e.name):null;
 const carry=carryRaw==null?(archiveCarry?.balance??0):Number(carryRaw);
 const provisional=carryRaw==null&&!!archiveCarry;
 const official=leaveCount(e.id,year);
 let used=official.used,planned=official.upcoming,confirmedAbsences=0;
 for(let m=1;m<=12;m++)for(let d=1;d<=new Date(year,m,0).getDate();d++){
  const date=ymd(year,m,d),loc=assigned(e,date);
  if(!employeeAt(e,date)||!loc)continue;
  if(override(e.id,date,loc)?.status==='IA')confirmedAbsences++;
 }
 return {quota,carry,provisional,used,planned,confirmedAbsences,
 remaining:quota==null?null:quota+carry-official.reserved};
}
function dateRange(from,to){
 const result=[];let d=localDate(from),last=localDate(to);
 while(d<=last&&result.length<=370){result.push(ymd(d.getFullYear(),d.getMonth()+1,d.getDate()));d.setDate(d.getDate()+1)}
 return result;
}
function attendanceSignal(e,loc,date){
 if(!employeeAt(e,date)||assigned(e,date)!==loc)return null;
 if(!e.attendanceFrom||e.attendanceFrom>date)return null;
 if(!isWorking(loc,date)||holiday(loc,date,e))return null;
 const manual=override(e.id,date,loc)?.status;
 if(['P','GO','BO','ND','IA','H','VH'].includes(manual))return null;
 if(evs(e.id,loc,date).some(x=>x.kind==='in'))return null;
 if(date>today())return null;
 if(date===today()){
  const start=plannedStart(e,date,loc);
  if(!start)return null;
  const sc=getSchedule(loc,date);
  const now=minutes(pad(new Date().getHours())+':'+pad(new Date().getMinutes()));
  if(now<=minutes(start)+Number(sc?.grace||0))return null;
 }
 return 'N';
}
function intervalCounters(e,loc,from,to){
 let late=0,lateDays=0,needsCheck=0,absent=0,worked=0;
 for(const day of dateRange(from,to)){
  if(!employeeAt(e,day)||assigned(e,day)!==loc)continue;
  const gap=attendanceSignal(e,loc,day);if(gap)needsCheck++;
  if(override(e.id,day,loc)?.status==='IA')absent++;
  const val=tardiness(e,day,loc);if(val!=null&&val>0){late+=val;lateDays++}
  worked+=eventsDay(e.id,loc,day).worked;
 }
 return {late,lateDays,needsCheck,absent,worked};
}

let latenessPeriod='day',latenessAnchor=today();
function latenessRange(){
 let target=/^\d{4}-\d{2}-\d{2}$/.test(latenessAnchor)?latenessAnchor:today();
 if(latenessPeriod==='day')return {dates:[target],title:'Dan: '+target};
 if(latenessPeriod==='month'){
  const [y,m]=target.split('-').map(Number);
  return {dates:Array.from({length:new Date(y,m,0).getDate()},(_,i)=>ymd(y,m,i+1)),title:'Mjesec: '+MONTHS[m-1]+' '+y};
 }
 const dt=localDate(target);dt.setDate(dt.getDate()-((dt.getDay()+6)%7));
 const dates=[];
 for(let i=0;i<7;i++){dates.push(ymd(dt.getFullYear(),dt.getMonth()+1,dt.getDate()));dt.setDate(dt.getDate()+1)}
 return {dates,title:'Sedmica: '+dates[0]+' – '+dates[6]};
}
function latenessDetails(){
 const {dates,title}=latenessRange();
 const stats=new Map(),details=[];
 let total={ok:0,warn:0,bad:0,late:0,unknown:0};
 for(const date of dates){
  if(date>today())continue;
  const workers=S.employees.filter(e=>
    (showAllStaff||(!e.hidden&&!e.isTest&&e.active!==false))&&
    employeeAt(e,date)&&assigned(e,date)===adminLoc);
  for(const e of workers){
   if(sickLeaveAt(e,date))continue;
   const sc=getSchedule(adminLoc,date),z=eventsDay(e.id,adminLoc,date),o=override(e.id,date,adminLoc);
   const shift=shiftInfo(e,date,adminLoc);
   let kind='unknown',label='',delay=0,first=z.starts[0],record=false;
   if(holiday(adminLoc,date,e)){label='Praznik / neradno'}
   else if(!isWorking(adminLoc,date)){label='Neradni dan'}
   else if(o&&['GO','BO','ND'].includes(o.status)){label=statusText(o.status)}
   else if(o?.status==='IA'){label='Potvrđen izostanak'}
   else if(first){
    const m=tardiness(e,date,adminLoc);
    if(m==null){label='Smjena nije podešena'}
    else{
     delay=m;record=true;
     kind=m===0?'ok':m<=10?'warn':'bad';
     label=m===0?'Na vrijeme':m<=10?'Kasnio '+m+' min':'Kasnio '+m+' min';
    }
   }else if(o?.status==='P'){label='Ručno prisutan · bez sata prijave'}
   else if(attendanceSignal(e,adminLoc,date)){label='Bez prijave – provjeriti'}
   else {label='Bez potvrđenih podataka'}
   if(!stats.has(e.id))stats.set(e.id,{name:e.name,ok:0,warn:0,bad:0,late:0,unknown:0});
   const agg=stats.get(e.id);
   if(record){
    agg[kind]++;total[kind]++;agg.late+=delay;total.late+=delay;
   }else if(label==='Bez prijave – provjeriti'){
    agg.unknown++;total.unknown++;
   }
   const dayHref='<button class="btn small" data-day="'+date+'" data-emp="'+esc(e.id)+'" data-loc="'+esc(adminLoc)+'">Detalji</button>';
   const style=kind==='ok'?'balkan-delay-row-ok':kind==='warn'?'balkan-delay-row-warn':kind==='bad'?'balkan-delay-row-bad':'';
   details.push('<tr class="'+style+'"><td>'+esc(date.split('-').reverse().join('.'))+'</td><td>'+esc(e.name)+'</td>'+
     '<td>'+esc(shift.label)+' <small>'+esc(shift.start||'—')+'</small></td>'+
     '<td>'+esc(first?clock(first.at):'—')+'</td>'+
     '<td><span class="balkan-delay-status balkan-delay-'+kind+'">'+esc(label)+'</span></td>'+
     '<td>'+dayHref+'</td></tr>');
  }
 }
 const sums=[...stats.values()].sort((a,b)=>a.name.localeCompare(b.name,'bs'));
 const summaryRows=sums.map(e=>'<tr><td><b>'+esc(e.name)+'</b></td>'+
 '<td><span class="balkan-delay-status balkan-delay-ok">'+e.ok+'</span></td>'+
 '<td><span class="balkan-delay-status balkan-delay-warn">'+e.warn+'</span></td>'+
 '<td><span class="balkan-delay-status balkan-delay-bad">'+e.bad+'</span></td>'+
 '<td><b>'+e.late+' min</b></td><td>'+e.unknown+'</td></tr>').join('');

 const selected=(period,name)=>'<button class="btn small" type="button" data-delay-period="'+period+'" aria-pressed="'+(latenessPeriod===period)+'">'+name+'</button>';
 return '<section class="panel" id="balkanLatenessPanel">'+
 '<div class="panel-head"><h2>Prijave i kašnjenja · '+esc(locName(adminLoc))+'</h2><span class="smalltext">'+esc(title)+'</span></div>'+
 '<div class="balkan-delay-controls"><div class="field"><label>Odaberi datum</label><input type="date" id="balkanDelayDate" value="'+latenessAnchor+'" max="'+today()+'"></div>'+
 '<div class="balkan-clickables">'+selected('day','Dan')+selected('week','Sedmica')+selected('month','Mjesec')+'</div></div>'+

 '<span class="balkan-delay-key"><b style="background:#12a16a"></b> Zeleno: na vrijeme</span>'+

 '<div class="balkan-delay-stat">'+formatSpan(total.ok,'Na vrijeme','ok')+
 formatSpan(total.warn,'Manje kašnjenje','warn')+formatSpan(total.bad,'Veće kašnjenje','bad')+
 '<span>Ukupno kašnjenje: '+total.late+' min</span><span>Bez prijave za provjeru: '+total.unknown+'</span></div>'+

function balkanNormalize24Time(target){
 if(!target||target.tagName!=='INPUT'||target.getAttribute('placeholder')!=='HH:MM')return;
 let v=target.value.trim();
 if(/^[0-9]{3,4}$/.test(v))v=v.padStart(4,'0').replace(/^([0-9]{2})([0-9]{2})$/,'$1:$2');
 else if(/^[0-9]:[0-9]{2}$/.test(v))v='0'+v;
 if(/^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(v))target.value=v;
}

function annualEntitlementSuggestion(employee,year,daysPerWeek=5,cutoff=''){
 const base=daysPerWeek===6?24:20,first=String(year)+'-01-01',last=String(year)+'-12-31';
 if(!employee)return {days:0,months:0,base,known:false};
 const hired=employee.hiredAt&&employee.hiredAt.length===10?employee.hiredAt:'';
 const terminated=employee.terminatedAt&&employee.terminatedAt.length===10?employee.terminatedAt:'';
 if(!hired)return {days:base,months:12,base,known:false};
 const start=hired>first?hired:first,end=[last,terminated||last,cutoff||last].sort()[0];
 if(start>end)return {days:0,months:0,base,known:true};
 let months=0;
 for(let m=1;m<=12;m++){
  const from=ymd(year,m,1),to=ymd(year,m,new Date(year,m,0).getDate());
  if(to<start||from>end)continue;
  const begin=start>from?start:from,finish=end<to?end:to;
  const diff=Math.round((Date.parse(finish+'T12:00:00Z')-Date.parse(begin+'T12:00:00Z'))/86400000)+1;
  if(diff>new Date(year,m,0).getDate()/2)months++;
 }
 const days=Math.floor(base*months/12+0.5);
 return {days,months,base,known:true};
}
function likelyLeaveReviewDays(employee,year){
 const results=[];
 if(!employee||!Number.isInteger(Number(year)))return results;
 const y=Number(year),endDate=ymd(y,12,31)<today()?ymd(y,12,31):today();
 const enteredMonths=new Set((S.overrides||[]).filter(o=>o.empId===employee.id&&['P','N'].includes(o.status)).map(o=>o.date.slice(0,7)));
 const firstScanned=new Set((S.events||[]).filter(v=>v.empId===employee.id&&v.kind==='in').map(v=>dateOfEvent(v.at).slice(0,7)));
 for(let m=1;m<=12;m++)for(let day=1;day<=new Date(y,m,0).getDate();day++){
  const date=ymd(y,m,day);if(date>endDate)continue;
  const loc=assigned(employee,date);
  if(!employeeAt(employee,date)||!loc||!isWorking(loc,date))continue;
  if(holiday(loc,date,employee)||sickLeaveAt(employee,date))continue;
  if(!!existingLeaveDay(employee.id,date))continue;
  if(dayStatus(employee,date,loc)!=='N'&&!agreedAnnualCandidate(employee,date,loc))continue;
  if(evs(employee.id,loc,date).length)continue;
  if(!(enteredMonths.has(date.slice(0,7))||firstScanned.has(date.slice(0,7))||(employee.attendanceFrom&&employee.attendanceFrom<=date)))continue;
  results.push({date,locId:loc});
 }
 return results;
}

// 19.10.2026: dan bez prijave ostaje N (nije radio) i NE troši godišnji odmor.
// Pojedinačne dane administrator može svjesno potvrditi kao GO (Provjera neoznačenih dana ili klik u kalendaru).
function agreedAnnualAutoOn(employee){return false}
function annualObservedMonth(employee,date){
 const m=date.slice(0,7);
 return (S.overrides||[]).some(o=>o.empId===employee.id&&o.date?.slice(0,7)===m&&['P','N','GO'].includes(o.status))||
 (S.events||[]).some(v=>v.empId===employee.id&&v.kind==='in'&&dateOfEvent(v.at).slice(0,7)===m);
}
const _annualOriginalStatus=dayStatus;
function agreedAnnualCandidate(employee,date,location){
 if(!employee||!location||!agreedAnnualAutoOn(employee)||date>=today()||Number(date.slice(0,4))<2026)return false;
 if(!employee.attendanceFrom||date<employee.attendanceFrom)return false;
 if(!employeeAt(employee,date)||assigned(employee,date)!==location||!isWorking(location,date))return false;
 if(holiday(location,date,employee)||sickLeaveAt(employee,date)||existingLeaveDay(employee.id,date))return false;
 if(evs(employee.id,location,date).length)return false;
 const code=override(employee.id,date,location)?.status;
 if(code)return false;
 if(!annualObservedMonth(employee,date))return false;
 return _annualOriginalStatus(employee,date,location)==='N';
}
dayStatus=function(employee,date,location){
 const status=_annualOriginalStatus(employee,date,location);
 return status==='N'&&agreedAnnualCandidate(employee,date,location)?'GO':status;
};
function agreedAnnualDates(employee,year){
 if(!employee||!agreedAnnualAutoOn(employee)||Number(year)<2026)return [];
 const dates=[],y=Number(year);
 for(let month=1;month<=12;month++){
  const count=new Date(y,month,0).getDate(),first=ymd(y,month,1);
  if(first>=today()||!annualObservedMonth(employee,first))continue;
  for(let d=1;d<=count;d++){
   const date=ymd(y,month,d);if(date>=today())break;
   const location=assigned(employee,date);
   if(agreedAnnualCandidate(employee,date,location))dates.push(date);
  }
 }
 return dates;
}
const _annualPriorLeaveCount=leaveCount;
leaveCount=function(id,year){
 const prior=_annualPriorLeaveCount(id,year),e=S.employees.find(x=>x.id===id);
 const dates=agreedAnnualDates(e,year),automatic=dates.length;
 return {...prior,autoDates:dates,autoDays:automatic,used:prior.used+automatic,
 reserved:prior.reserved+automatic,remaining:prior.g?prior.g.days-prior.reserved-automatic:null};
};
// Informativni obračun završenih mjeseci rada, ne zamjenjuje zakonski srazmjerni obračun.
function balkanCompletedServiceMonths(employee,year,until){
 const y=Number(year),hi=String(employee?.hiredAt||''),lo=String(employee?.terminatedAt||'');
 const start=hi&&hi>ymd(y,1,1)?hi:ymd(y,1,1);
 let end=ymd(y,12,31);if(until&&until<end)end=until;if(lo&&lo<end)end=lo;
 if(end<start)return 0;
 const dateStart=new Date(start+'T12:00:00Z'),endAfter=new Date(end+'T12:00:00Z');
 endAfter.setUTCDate(endAfter.getUTCDate()+1);
 let result=0;
 for(let n=1;n<=12;n++){
  const target=new Date(Date.UTC(dateStart.getUTCFullYear(),dateStart.getUTCMonth()+n,1,12));
  const monthLast=new Date(Date.UTC(target.getUTCFullYear(),target.getUTCMonth()+1,0)).getUTCDate();
  target.setUTCDate(Math.min(dateStart.getUTCDate(),monthLast));
  if(target<=endAfter)result=n;else break;
 }
 return result;
}
function agreedAnnualTodaySummary(e,year){
 const y=Number(year),g=leaveGrant(e.id,y),current=today();
 const ref=ymd(y,1,1),loc=assigned(e,ref)||e.defaultLocationId;
 const six=g?.weekdays?.length===6||(!g&&getSchedule(loc,ref)?.days?.length===6);
 const full=annualEntitlementSuggestion(e,y,six?6:5);
 const quota=g?.days??(e.leaveQuotaByYear?.[y]!=null?Number(e.leaveQuotaByYear[y]):full.days);
 const monthsNow=balkanCompletedServiceMonths(e,y,current);
 const monthsInYear=balkanCompletedServiceMonths(e,y,ymd(y,12,31));
 // Ako je godisnji fond vec srazmjerno utvrdjen (< punog minimuma), podijeli ga
 // brojem mjeseci rada; puni fond 24/20 uvijek se dijeli sa 12 mjeseci.
 const prorated=monthsInYear<12&&quota<full.base;

 const accrued=y>Number(current.slice(0,4))?0:y<Number(current.slice(0,4))?quota:Math.min(quota,Math.round(monthlyRate*monthsNow));

   Nadogradnja na GitHub main 12866954191a65d9948086169164eb3e099a3f21.
   Arhiva 2025. ostaje u postojecem history-2025.js; glavni Firebase tok je nepromijenjen.

const _balkanLeaveSummaryBeforeCarryAudit=yearLeaveSummary;
function balkanCarryAudit(employee,year,asOf=today()){
 const y=Number(year),explicit=employee.leaveCarryByYear?.[y];
 const archive=y===2026&&explicit==null?window.BALKAN_ARCHIVE?.getCarryover?.(employee.name):null;
 const value=explicit==null?(archive?.balance??0):explicit;
 const raw=Number.isFinite(Number(value))?Number(value):0;
 const defaultDeadline=ymd(y,6,30);
 const configured=employee.leaveCarryDeadlineByYear?.[y];
 const deadline=/^\d{4}-\d\d-\d\d$/.test(String(configured||''))?configured:defaultDeadline;
 const positive=Math.max(0,raw),negative=Math.min(0,raw);
 const issued=(S.leaveDecisions||[]).filter(x=>x.empId===employee.id&&Number(x.year)===y&&x.status==='issued').flatMap(x=>x.days||[]);
 const manual=manualLeaveDates(employee.id,y);
 const automatic=agreedAnnualDates(employee,y);
 const all=[...new Set([...issued,...manual,...automatic])].filter(date=>{
  if(!/^\d{4}-\d\d-\d\d$/.test(date)||date.slice(0,4)!==String(y))return false;
  const loc=assigned(employee,date);
  if(!employeeAt(employee,date)||!loc||!isWorking(loc,date)||holiday(loc,date,employee)?.paid||sickLeaveAt(employee,date))return false;
  if(S.events.some(v=>v.empId===employee.id&&v.kind==='in'&&dateOfEvent(v.at)===date))return false;
  if(S.overrides.some(o=>o.empId===employee.id&&o.date===date&&o.status==='BO'))return false;
  return true;
 }).sort();
 const spentOnCarry=Math.min(positive,all.filter(d=>d<=deadline).length);
 const notSpent=positive-spentOnCarry;
 const active=asOf<=deadline?notSpent:0;
 const expired=asOf>deadline?notSpent:0;
 return {raw,deadline,spentOnCarry,active,expired,negative,provisional:explicit==null&&!!archive,
  known:explicit!=null||!!archive,source:explicit!=null?'ručni unos':archive?.source||'nema potvrđenog prenosa'};
}
function balkanLeaveDashboard(employee,year){
 const existing=_balkanLeaveSummaryBeforeCarryAudit(employee,year);
 const info=agreedAnnualTodaySummary(employee,year);
 const carry=balkanCarryAudit(employee,year);
 const used=existing.used,planned=existing.planned;
 const correction=carry.spentOnCarry+carry.active+carry.negative;
 const total=info.quota;
 const accrued=info.accrued;
 return {...existing,quota:total,accrued,used,planned,carry:carry.raw,
  carryUsed:carry.spentOnCarry,carryActive:carry.active,carryExpired:carry.expired,
  carryDeadline:carry.deadline,carrySource:carry.source,carryKnown:carry.known,
  remaining:accrued+correction-used-planned,
  annualRemaining:total+correction-used-planned,
  provisional:carry.provisional||!info.confirmed&&employee.leaveQuotaByYear?.[year]==null,
  rightConfirmed:!!leaveGrant(employee.id,Number(year))||employee.leaveQuotaByYear?.[year]!=null,
  knownHire:!!employee.hiredAt};
}

function balkanAnnualBulkCandidates(year){
 const y=Number(year),now=today();
 if(y!==new Date().getFullYear())return [];
 return S.employees.filter(e=>e.active!==false&&!e.hidden&&!e.isTest&&
  employeeAt(e,now)&&!leaveGrant(e.id,y)).map(e=>{
  const ref=e.hiredAt&&e.hiredAt>ymd(y,1,1)?e.hiredAt:ymd(y,1,1);

  const six=schedule?.days?.length===6,weekdays=six?[1,2,3,4,5,6]:[1,2,3,4,5];

 });

 function autoStatus(worker,date,loc){
  // Status kakav bi dan imao BEZ ručne izmjene (skeniranja, praznici, raspored).
  const saved=S.overrides;
  S.overrides=saved.filter(o=>!(o.empId===worker.id&&o.date===date&&o.locId===loc));
  try{return dayStatus(worker,date,loc)}finally{S.overrides=saved}
 }
 function lockReason(worker,date,loc){
  if(!employeeAt(worker,date)||assigned(worker,date)!==loc)return 'Radnik nema radni odnos ili dodjelu u ovom objektu na taj dan.';
  if(existingLeaveDay(worker.id,date))return 'Ovaj dan je dio izdatog rješenja o godišnjem odmoru. Mijenja se u meniju Godišnji odmori.';
  if(sickLeaveAt(worker,date))return 'Radnik je na bolovanju. Bolovanje se mijenja u Radnici → Bolovanje.';
  if(holiday(loc,date,worker))return 'Na ovaj dan je praznik ili odsustvo. Mijenja se u meniju Praznici i odsustva.';
  return '';
 }
 function nextStatus(worker,date,loc,current){
  const auto=autoStatus(worker,date,loc);
  if(date>today())return current==='GO'?null:'GO';                 // planiranje odmora unaprijed
  if(auto==='ND'||!isWorking(loc,date))return current==='P'?null:'P'; // neradni dan: rad ↔ automatski
  const next=CYCLE[current]||'P';
  return next===auto?null:next;                                    // null = vrati automatski status
 }

 function impact(ids,withOverrides){
  const chosen=S.events.filter(v=>ids.has(v.id));
  const pairs=new Map();
  for(const v of chosen){const d=dateOfEvent(v.at);pairs.set(keyOf(v.empId,d,v.locId),{empId:v.empId,date:d,loc:v.locId})}
  const measure=()=>{let late=0,worked=0;for(const p of pairs.values()){const e=S.employees.find(x=>x.id===p.empId);if(!e)continue;
   const t=tardiness(e,p.date,p.loc);if(t>0)late+=t;worked+=eventsDay(p.empId,p.loc,p.date).worked||0}return{late,worked}};

    (f.withOverrides?'<br>Ručni statusi za te dane koji se brišu: <b>'+im.overrides.length+'</b>.':'')+'<br>Ostali radnici i dani se ne mijenjaju.</div>':'')+
   '<label class="bkd-opt"><input type="checkbox" data-bkd-ovr="1"'+(f.withOverrides?' checked':'')+'><span>Obriši i ručne statuse (P, N, GO…) <b>samo za izabrane radnike i dane</b>. Bez ove oznake ručni statusi ostaju.</span></label>'+
   '<div class="modalfoot"><button class="btn" type="button" data-act="close-modal">Zatvori</button><button class="btn bkd-del" type="button" data-bkd-delete="1"'+(f.sel.size?'':' disabled')+'>Obriši izabrano ('+f.sel.size+')</button></div>';

 function historyTab(){
  const items=trash();
  if(!items.length)return '<div class="bkd-empty">Istorija brisanja je prazna. Svako brisanje skeniranja pojaviće se ovdje i moći će se vratiti.</div>';
  return '<div class="bkd-hist">'+items.map(b=>{
   const people=[...new Set((b.events||[]).map(v=>name(v.empId)))];
   const restored=!!b.restoredAt;
   return '<div class="bkd-batch'+(restored?' restored':'')+'"><h4>'+esc(b.title||'Brisanje skeniranja')+(restored?'<span class="bkd-tag">VRAĆENO '+esc(dLabel(b.restoredAt.slice(0,10))+' '+tLabel(b.restoredAt))+'</span>':'')+'</h4>'+
    '<div class="acts">'+(restored?'':'<button class="btn small primary" type="button" data-bkd-restore="'+esc(b.id)+'">↺ Vrati</button>')+'<button class="btn small" type="button" data-bkd-purge="'+esc(b.id)+'" title="Trajno ukloni iz istorije">Ukloni</button></div>'+
    '<p>Obrisano '+esc(dLabel(b.at.slice(0,10))+' u '+tLabel(b.at))+' · '+(b.events||[]).length+' skeniranja'+((b.overrides||[]).length?' + '+b.overrides.length+' ručnih statusa':'')+' · '+esc(people.slice(0,3).join(', ')+(people.length>3?' i još '+(people.length-3):''))+'</p>'+
    '<details><summary>Šta je obrisano</summary><ul>'+(b.events||[]).slice().sort((x,y)=>x.at.localeCompare(y.at)).map(v=>'<li>'+esc(dLabel(dateOfEvent(v.at))+' '+tLabel(v.at)+' · '+name(v.empId)+' · '+(v.kind==='out'?'odlazak':'dolazak')+' · '+(v.source==='barcode'?'kartica':'ručno'))+'</li>').join('')+
    (b.overrides||[]).map(o=>'<li>'+esc(dLabel(o.date)+' · '+name(o.empId)+' · ručni status '+o.status)+'</li>').join('')+'</ul></details></div>';
  }).join('')+'</div>';
 }
 function show(){
  if(!f.loc)f.loc=calLoc||S.locations[0]?.id;
  const count=trash().filter(b=>!b.restoredAt).length;
  modal('Brisanje skeniranja','<div class="bkd-tabs"><button type="button" data-bkd-tab="delete" class="'+(f.tab==='delete'?'on':'')+'">Obriši skeniranja</button><button type="button" data-bkd-tab="history" class="'+(f.tab==='history'?'on':'')+'">Istorija brisanja'+(count?' ('+count+')':'')+'</button></div>'+
   (f.tab==='delete'?deleteTab():historyTab()));
 }
 function open(opts={}){
  f={...f,tab:opts.tab||'delete',sel:new Set(opts.sel||[]),withOverrides:false,
   loc:opts.loc||calLoc||S.locations[0]?.id,from:opts.from||f.from||today(),to:opts.to||opts.from||f.to||today(),emp:opts.emp??'',src:opts.src??''};
  show();
 }
 window.balkanOpenScanDelete=open;
 function persist(){return save().catch(err=>alert('Izmjena NIJE sačuvana: '+(err?.message||err)))}
 function doDelete(ids,{withOverrides=false,silentConfirm=false,title=''}={}){
  const im=impact(ids,withOverrides);
  if(!im.chosen.length)return null;
  if(!silentConfirm&&!confirm('Obrisati '+im.chosen.length+' skeniranja ('+im.workers+' radnika, '+im.pairs.size+' dana)?\n\n'+
   'Kašnjenje i sati za te dane biće preračunati ('+minutes(im.before.late)+' kašnjenja → '+minutes(im.after.late)+').\n'+
   (withOverrides?'Brišu se i ručni statusi za te dane: '+im.overrides.length+'.\n':'')+
   'Sve se može vratiti u „Istorija brisanja“.'))return null;
  const people=[...new Set(im.chosen.map(v=>name(v.empId)))];
  const dates=[...new Set(im.chosen.map(v=>dateOfEvent(v.at)))].sort();
  const batch={id:uid(),at:new Date().toISOString(),by:S.admin?.username||'Administrator',
   title:title||(locName(im.chosen[0].locId)+' · '+(dates.length>1?dLabel(dates[0])+' – '+dLabel(dates[dates.length-1]):dLabel(dates[0]))+' · '+(people.length===1?people[0]:people.length+' radnika')),
   events:jsonCopy(im.chosen),overrides:jsonCopy(im.overrides),
   impact:{lateBefore:im.before.late,lateAfter:im.after.late,workedBefore:im.before.worked,workedAfter:im.after.worked},restoredAt:null};
  S.events=S.events.filter(v=>!ids.has(v.id));
  if(im.overrides.length){const drop=new Set(im.overrides.map(o=>o.id));S.overrides=S.overrides.filter(o=>!drop.has(o.id))}
  trash().unshift(batch);
  audit('Brisanje skeniranja',batch.title+' · '+batch.events.length+' skeniranja'+(batch.overrides.length?' + '+batch.overrides.length+' ručnih statusa':''));
  render();persist();
  return batch;
 }
 function restore(id){
  const b=trash().find(x=>x.id===id);if(!b||b.restoredAt)return;
  let back=0,skipped=0;
  for(const v of b.events||[]){if(S.events.some(x=>x.id===v.id)){skipped++;continue}S.events.push(jsonCopy(v));back++}
  for(const o of b.overrides||[]){
   if(S.overrides.some(x=>x.empId===o.empId&&x.date===o.date&&x.locId===o.locId)){skipped++;continue}
   S.overrides.push(jsonCopy(o));back++;
  }
  b.restoredAt=new Date().toISOString();
  audit('Vraćeno obrisano skeniranje',b.title+' · vraćeno '+back+(skipped?', preskočeno (već postoji) '+skipped:''));
  render();persist();
  return {back,skipped};
 }
 function toastUndo(batch){
  if(typeof window.bkToast==='function')window.bkToast('Obrisano '+batch.events.length+' skeniranja · '+batch.title,{canUndo:true,onUndo:()=>{restore(batch.id);if(document.querySelector('.bkd-tabs'))show()}});
 }

 const modalRoot=document.getElementById('modal');
 modalRoot.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-bkd-field]')){f[t.dataset.bkdField]=t.value;if(f.from>f.to)(t.dataset.bkdField==='from'?f.to=f.from:f.from=f.to);f.sel.clear();show();return}
  if(t.matches('[data-bkd-ev]')){t.checked?f.sel.add(t.dataset.bkdEv):f.sel.delete(t.dataset.bkdEv);show();return}
  if(t.matches('[data-bkd-ovr]')){f.withOverrides=t.checked;show()}
 });
 modalRoot.addEventListener('click',e=>{
  const t=e.target.closest('[data-bkd-tab],[data-bkd-all],[data-bkd-none],[data-bkd-delete],[data-bkd-restore],[data-bkd-purge],[data-bkd-range]');
  if(!t)return;
  e.preventDefault();e.stopImmediatePropagation();
  if(t.dataset.bkdTab){f.tab=t.dataset.bkdTab;show();return}
  if(t.dataset.bkdRange){
   const d=new Date(),iso=x=>x.getFullYear()+'-'+two(x.getMonth()+1)+'-'+two(x.getDate());
   if(t.dataset.bkdRange==='today'){f.from=f.to=today()}
   if(t.dataset.bkdRange==='yesterday'){d.setDate(d.getDate()-1);f.from=f.to=iso(d)}
   if(t.dataset.bkdRange==='week'){f.to=today();d.setDate(d.getDate()-6);f.from=iso(d)}
   if(t.dataset.bkdRange==='month'){f.to=today();f.from=today().slice(0,8)+'01'}
   f.sel.clear();show();return;
  }
  if(t.dataset.bkdAll){for(const v of list().slice(0,500))f.sel.add(v.id);show();return}
  if(t.dataset.bkdNone){f.sel.clear();show();return}
  if(t.dataset.bkdDelete){const b=doDelete(new Set(f.sel),{withOverrides:f.withOverrides});if(b){f.sel.clear();f.tab='history';show();toastUndo(b)}return}
  if(t.dataset.bkdRestore){const r=restore(t.dataset.bkdRestore);show();if(r)alert('Vraćeno: '+r.back+(r.skipped?'. Preskočeno jer već postoji: '+r.skipped:'')+'.\nKašnjenje i sati su ponovo izračunati.');return}
  if(t.dataset.bkdPurge){
   const b=trash().find(x=>x.id===t.dataset.bkdPurge);if(!b)return;
   if(!confirm('Trajno ukloniti ovaj zapis iz istorije brisanja?'+(b.restoredAt?'':'\nNAKON TOGA OVA SKENIRANJA SE VIŠE NE MOGU VRATITI.')))return;
   S.scanTrash=trash().filter(x=>x.id!==b.id);audit('Trajno uklonjeno iz istorije brisanja',b.title);render();persist();show();
  }
 },true);
 // --- otvaranje i pojedinačno brisanje iz detalja dana ---
 document.getElementById('app').addEventListener('click',e=>{
  const open1=e.target.closest('[data-bkd-open]'),single=e.target.closest('[data-del-event]');
  if(open1){e.preventDefault();e.stopImmediatePropagation();
   open({from:open1.dataset.date||undefined,to:open1.dataset.date||undefined,emp:open1.dataset.emp||'',loc:open1.dataset.loc||undefined,tab:open1.dataset.tab});return}
  if(single){e.preventDefault();e.stopImmediatePropagation();
   const v=S.events.find(x=>x.id===single.dataset.delEvent);if(!v)return;
   if(!confirm('Obrisati ovo skeniranje?\n'+name(v.empId)+' · '+dLabel(dateOfEvent(v.at))+' '+tLabel(v.at)+' · '+(v.kind==='out'?'odlazak':'dolazak')+'\n\nKašnjenje i sati se preračunavaju. Može se vratiti u „Istorija brisanja“.'))return;
   const b=doDelete(new Set([v.id]),{silentConfirm:true,title:'Pojedinačno: '+name(v.empId)+' · '+dLabel(dateOfEvent(v.at))+' '+tLabel(v.at)});
   if(b)toastUndo(b);
  }
 },true);
})();

   '@page{size:A4;margin:0}body{margin:0;background:#e8edf3;font-family:Arial,sans-serif}.bar{position:sticky;top:0;background:#14263d;color:#fff;display:flex;gap:12px;align-items:center;justify-content:center;padding:12px}.bar button{background:#2a62b8;color:#fff;border:0;border-radius:8px;padding:10px 16px;font:700 14px Arial;cursor:pointer}.sheet{margin:18px auto;width:210mm;box-shadow:0 8px 30px #0003}@media print{body{background:#fff}.bar{display:none}.sheet{margin:0;box-shadow:none}}</style></head><body>'+

  w.document.close();w.focus();
 }
 let jmbCache=null; // JMB se NE čuva u bazi; pamti se samo dok je stranica otvorena, za odmah štampu.
 const _prevDocDecision=docDecision;
 docDecision=function(id,action){
  const d=S.leaveDecisions.find(x=>x.id===id);if(!d)return;
  if(action!=='print')return _prevDocDecision(id,action);
  if(!unlocked){alert('Prijavi se kao administrator.');return}
  let jmb=jmbCache&&jmbCache.empId===d.empId?jmbCache.jmb:null;
  if(jmb===null){jmb=prompt('JMB (opcionalno, samo za štampu; neće biti sačuvan u programu):','');if(jmb===null)return}
  printDecision(d,jmb);
 };

 const two=n=>String(n).padStart(2,'0');
 const MON=['Januar','Februar','Mart','April','Maj','Jun','Jul','Avgust','Septembar','Oktobar','Novembar','Decembar'];
 const dl=s=>{if(!s)return '';const [y,m,d]=s.split('-');return Number(d)+'.'+Number(m)+'.'+y+'.'};
 let wz=null;
 function wzEmployee(){return S.employees.find(e=>e.id===wz.empId)}
 function grantFor(e){return e?leaveGrant(e.id,Number(wz.year)):null}
 function statusAt(e,date){
  if(!e||!employeeAt(e,date))return 'out';
  if(existingLeaveDay(e.id,date))return 'GO';
  return dayStatus(e,date,assigned(e,date)||e.defaultLocationId);
 }
 function rangeInfo(){
  const e=wzEmployee(),g=grantFor(e);
  if(!e||!wz.from)return null;
  const to=wz.to||wz.from;
  let days=[],error='';
  try{days=g?leaveDays(wz.from,to,g.weekdays,[],e.id):[]}catch(err){error=err.message}
  const conflicts=days.filter(date=>S.events.some(v=>v.empId===e.id&&dateOfEvent(v.at)===date&&v.kind==='in')||S.overrides.some(o=>o.empId===e.id&&o.date===date&&['BO','P','ND'].includes(o.status)));
  const dup=days.filter(x=>existingLeaveDay(e.id,x)||S.overrides.some(o=>o.empId===e.id&&o.date===x&&o.status==='GO'));
  const count=g?leaveCount(e.id,Number(wz.year)):null;
  const bal=lvBalance(e,Number(wz.year));
  return {days,conflicts,dup,error,remaining:bal.remaining,after:bal.remaining==null?null:bal.remaining-days.length,overGrant:count&&days.length>count.remaining?count.remaining:null,set:new Set(days),conf:new Set([...conflicts,...dup])};
 }
 function monthHtml(y,m,e,ri){
  const first=new Date(y,m-1,1),n=new Date(y,m,0).getDate(),lead=(first.getDay()+6)%7;
  let cells='';for(let i=0;i<lead;i++)cells+='<span></span>';
  for(let d=1;d<=n;d++){
   const date=y+'-'+two(m)+'-'+two(d),st=statusAt(e,date);
   const inR=wz.from&&date>=wz.from&&date<=(wz.to||wz.from);
   const cls=[st==='F'?'':st,inR?'in':'',ri?.set.has(date)?'count':'',date===wz.from||date===wz.to?'edge':'',ri?.conf.has(date)?'conf':''].filter(Boolean).join(' ');
   const tip=dl(date)+' · '+(st==='out'?'van radnog odnosa':st==='F'?'još nije nastupio':statusText(st));
   cells+='<button type="button" class="'+cls+'" data-wz-day="'+date+'" title="'+esc(tip)+'"'+(st==='out'?' disabled':'')+'>'+d+'</button>';
  }
  return '<div class="lv-cal"><h4>'+MON[m-1]+' '+y+'.</h4><div class="wk">'+['Pon','Uto','Sri','Čet','Pet','Sub','Ned'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="days">'+cells+'</div></div>';
 }
 function decisionDraft(){
  const e=wzEmployee(),g=grantFor(e),f=document.getElementById('leaveDecisionForm');
  const val=n=>f?.elements[n]?.value||'';
  return {id:'draft',empId:e?.id,employeeName:e?.name||'',year:Number(wz.year),number:val('number'),from:wz.from||'',to:wz.to||wz.from||'',
   position:val('position'),residence:val('residence'),contract:val('contract'),entitlementAtIssue:g?.days??null,
   templateSnapshot:S.leaveTemplates.find(x=>x.id==='annual-main')};
 }
 function paint(){
  const e=wzEmployee(),g=grantFor(e),ri=rangeInfo();
  const f=document.getElementById('leaveDecisionForm');if(!f)return;
  f.elements.from.value=wz.from||'';f.elements.to.value=wz.to||wz.from||'';
  f.elements.year.value=wz.year;
  const [y,m]=wz.month.split('-').map(Number),n2=m===12?[y+1,1]:[y,m+1];
  document.getElementById('wzCal').innerHTML='<div class="lv-calnav"><button type="button" data-wz-month="-1" aria-label="Prethodni mjesec">‹</button><span class="lv-hint">Klikni prvi dan odmora, pa posljednji dan.</span><button type="button" data-wz-month="1" aria-label="Sljedeći mjesec">›</button></div><div class="lv-cals">'+monthHtml(y,m,e,ri)+monthHtml(n2[0],n2[1],e,ri)+'</div>'+
   '<div class="lv-legend"><span><i style="background:#d3f1e2"></i>Radio</span><span><i style="background:#ffe3e7"></i>Nije radio</span><span><i style="background:#d9e8ff"></i>Već na godišnjem</span><span><i style="background:#ece2fd"></i>Bolovanje</span><span><i style="background:#d5efe6"></i>Praznik</span><span><i style="background:#fff;border:1px solid #d5dde8"></i>Neradni dan</span><span><i style="background:#14366b"></i>Izabrani period</span></div>';
  let sum='';
  if(!e)sum='<div class="lv-sum">Izaberi radnika.</div>';
  else if(!g)sum='<div class="lv-sum bad">Radnik nema utvrđen godišnji fond za '+wz.year+'. <button type="button" class="btn small" data-leave-grant="'+esc(e.id)+'">Odredi godišnji fond</button></div>';
  else if(!ri){const bl=lvBalance(e,Number(wz.year));sum='<div class="lv-sum">Ukupno za odmor: <b>'+fmtN(bl.total)+'</b> · iskorišćeno '+bl.used+' · planirano '+bl.planned+' · <b>preostalo '+fmtN(bl.remaining)+'</b>. Izaberi period u kalendaru.</div>'}
  else{
   const bad=ri.error||ri.conflicts.length||ri.dup.length||ri.after<0||ri.overGrant!=null;
   sum='<div class="lv-sum'+(bad?' bad':'')+'">Period: <b>'+dl(wz.from)+' – '+dl(wz.to||wz.from)+'</b> · radnih dana odmora: <b>'+ri.days.length+'</b> · preostalo poslije: <b>'+fmtN(ri.after)+'</b> od '+fmtN(lvBalance(e,Number(wz.year)).total)+
    (ri.error?'<ul><li>'+esc(ri.error)+'</li></ul>':'')+
    ((ri.conflicts.length||ri.dup.length||ri.after<0)?'<ul>'+
     (ri.conflicts.length?'<li>Radnik je radio ili je na bolovanju/slobodan: '+ri.conflicts.slice(0,8).map(dl).join(', ')+(ri.conflicts.length>8?' …':'')+'. Izaberi drugi period ili prvo ispravi evidenciju.</li>':'')+
     (ri.dup.length?'<li>Već je godišnji (drugo rješenje ili ručni GO): '+ri.dup.slice(0,8).map(dl).join(', ')+'.</li>':'')+
     (ri.after<0?'<li>Izabrano je više dana nego što je preostalo.</li>':'')+'</ul>':'')+
    (ri.overGrant!=null&&ri.after>=0?'<ul><li>Jedno rješenje za '+wz.year+'. može obuhvatiti najviše '+ri.overGrant+' dana iz prava za tu godinu. Preneseni dani se troše automatski do roka prenosa.</li></ul>':'')+
    '<div class="lv-hint">Broje se samo radni dani prema radnoj sedmici radnika ('+(g.weekdays?.length===6?'6':'5')+' dana); nedjelje i neradni praznici se ne broje.</div></div>';
  }
  document.getElementById('wzSum').innerHTML=sum;
  const info=document.getElementById('wzEmpInfo');
  if(info)info.innerHTML=e?(esc(locName(assigned(e,today())||e.defaultLocationId))+' · zaposlen od '+esc(dl(e.hiredAt)||'—')+(g?' · pravo '+wz.year+'.: <b>'+g.days+'</b> dana':'')):'';
  // obavještenje o roku dostave
  const deliv=f.elements.deliveredAt.value,notice=wz.from&&deliv?Math.round((new Date(wz.from+'T12:00:00Z')-new Date(deliv+'T12:00:00Z'))/86400000):99;
  document.getElementById('wzShort').style.display=notice<30?'flex':'none';
  document.getElementById('wzPaper').innerHTML=rjHtml(decisionDraft(),f.elements.jmb.value).replace('class="rj-page"','class="rj-page rj-mark"');
 }

 const modalRoot=document.getElementById('modal');
 modalRoot.addEventListener('click',ev=>{
  if(!wz||!document.getElementById('wzCal'))return;
  const day=ev.target.closest('[data-wz-day]'),nav=ev.target.closest('[data-wz-month]');
  if(day){ev.preventDefault();ev.stopImmediatePropagation();const d=day.dataset.wzDay;
   if(!wz.from||wz.to||d<wz.from){wz.from=d;wz.to=''}else wz.to=d;paint();return}
