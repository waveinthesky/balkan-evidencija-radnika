<body><div id="v6Login" style="position:fixed;inset:0;background:#f2f6fb;z-index:9999;display:grid;place-items:center;font-family:Arial,sans-serif;padding:20px"><div style="background:white;border:1px solid #d9e2ef;border-radius:17px;padding:30px;width:100%;max-width:410px;box-shadow:0 12px 48px #14283F12"><h1 style="font-size:24px">BALKAN – Administracija</h1><p id="v6AuthMessage">Povezivanje sa Firebaseom…</p><form id="v6LoginForm" style="display:none"><label>E-mail administratora<input id="v6Email" type="email" required autocomplete="username" style="display:block;width:100%;padding:11px;margin:7px 0 14px"></label><label>Lozinka<input id="v6Password" type="password" autocomplete="current-password" required style="display:block;width:100%;padding:11px;margin:7px 0 14px"></label><button style="width:100%;padding:13px;background:#2b68db;color:white;border:0;border-radius:9px" type="submit">Prijavi se</button></form><p style="font-size:12px;color:#62738e">Samo administratorski Firebase nalog može mijenjati evidenciju.</p></div></div><div id="app"></div><div id="modal"></div>
<script>

'use strict';
const APP='BALKAN', MONTHS=['Januar','Februar','Mart','April','Maj','Juni','Juli','August','Septembar','Oktobar','Novembar','Decembar'],WEEK=['Ned','Pon','Uto','Sri','Čet','Pet','Sub'];
const LEGEND={P:['P','Prijava evidentirana / ručni unos'],N:['N','Nema prijave / provjera'],GO:['GO','Godišnji odmor'],BO:['BO','Bolovanje'],ND:['ND','Neradni dan'],RP:['!','Za provjeru / nedostaje odjava'],H:['PR','Praznik'],VH:['V','Vjerski praznik – plaćeno odsustvo'],F:['–','Još nije nastupio']};
const $=(id)=>document.getElementById(id);const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||('id_'+Date.now()+'_'+Math.random().toString(36).slice(2));
const pad=n=>String(n).padStart(2,'0');function today(){let x=new Date();return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`}
function localDate(s){return new Date(s+'T12:00:00')}function wd(s){return localDate(s).getDay()}function ymd(y,m,d){return `${y}-${pad(m)}-${pad(d)}`};function dateTimeDisplay(x){if(!x)return '—';let d=new Date(x);return Number.isNaN(+d)?'—':d.toLocaleString('bs-BA',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}function clock(x){if(!x)return '—';let d=new Date(x);return Number.isNaN(+d)?'—':`${pad(d.getHours())}:${pad(d.getMinutes())}`}
function minutes(h){let a=(h||'00:00').split(':').map(Number);return a[0]*60+(a[1]||0)}
function minutesBetween(a,b){return Math.max(0,(new Date(b)-new Date(a))/60000)}
function humanMinutes(t){return t==null?'—':`${Math.floor(t/60)} h ${pad(Math.round(t%60))} min`}
const defaultState=()=>({v:1,locations:[{id:'m1',name:'Market 1',active:true,schedules:[{id:uid(),from:'2020-01-01',open:'07:15',close:'21:00',days:[1,2,3,4,5,6],grace:0}]},{id:'m2',name:'Market 2',active:true,schedules:[{id:uid(),from:'2020-01-01',open:'07:15',close:'21:00',days:[1,2,3,4,5,6],grace:0}]}],employees:[],events:[],overrides:[],holidays:[],audit:[],admin:null,station:'m1',createdAt:new Date().toISOString()});
let db=null,S=null,route='kiosk',unlocked=sessionStorage.getItem('balkan_admin')==='yes',mode='in',chosenDate=today(),chosenEmp=null,calY=new Date().getFullYear(),calM=new Date().getMonth()+1,calLoc='m1',adminLoc='m1',toast='',pendingPersist=Promise.resolve();
function newStore(){return new Promise((resolve,reject)=>{if(!indexedDB)return reject(Error('IndexedDB nije dostupna'));let req=indexedDB.open('balkan-evidencija-v1',1);req.onupgradeneeded=()=>{req.result.createObjectStore('kv')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function storeRead(){return new Promise((resolve,reject)=>{let tx=db.transaction('kv','readonly'),r=tx.objectStore('kv').get('main');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
function storeWrite(value){return new Promise((resolve,reject)=>{let tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(value,'main');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function save(){let snap=structuredClone(S);pendingPersist=pendingPersist.catch(()=>{}).then(async()=>{if(db)await storeWrite(snap);else localStorage.setItem('BALKAN_DATABASE',JSON.stringify(snap))});try{await pendingPersist}catch(e){alert('GREŠKA: Podaci nisu mogli biti sačuvani! '+e.message);throw e}}
async function init(){try{db=await newStore();S=await storeRead()}catch(e){db=null;try{S=JSON.parse(localStorage.getItem('BALKAN_DATABASE')||'null')}catch{S=null}}S||=defaultState();calLoc=S.station||'m1';adminLoc=calLoc;unlocked=!!(S.admin&&unlocked);if(!S.admin)route='setup';render()}
function audit(action,detail){S.audit.unshift({id:uid(),at:new Date().toISOString(),action,detail,by:'Administrator (lokalno)'});if(S.audit.length>5000)S.audit.length=5000}
function statusText(code){return LEGEND[code]?.[1]||'Nepoznato'}
function employeeAt(e,date){return (!e.hiredAt||date>=e.hiredAt)&&(!e.terminatedAt||date<=e.terminatedAt)}
function locName(id){return S.locations.find(l=>l.id===id)?.name||'Nepoznat objekat'}
function getSchedule(locId,date){let loc=S.locations.find(l=>l.id===locId);return loc?.schedules?.filter(x=>x.from<=date).sort((a,b)=>b.from.localeCompare(a.from))[0]||null}
function isWorking(locId,date){let sc=getSchedule(locId,date);return sc?sc.days.includes(wd(date)):true}
function holiday(locId,date){return S.holidays.find(h=>h.date===date&&(!h.locationId||h.locationId===locId))}
function assigned(e,date){let a=(e.assignments||[{from:e.hiredAt||'1900-01-01',locationId:e.defaultLocationId}]).filter(a=>a.from<=date).sort((a,b)=>b.from.localeCompare(a.from))[0];return a?.locationId||e.defaultLocationId}
function dateOfEvent(at){let x=new Date(at);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`}
function evs(empId,locId,date){return S.events.filter(v=>v.empId===empId&&v.locId===locId&&dateOfEvent(v.at)===date).sort((a,b)=>a.at.localeCompare(b.at))}
function allEvents(empId){return S.events.filter(v=>v.empId===empId).sort((a,b)=>a.at.localeCompare(b.at))}
function eventsDay(empId,locId,date){let starts=evs(empId,locId,date).filter(e=>e.kind==='in'), full=allEvents(empId), outputs=[];let worked=0,open=false;for(let item of starts){let nextIn=full.find(x=>x.kind==='in'&&x.at>item.at),end=full.find(x=>x.kind==='out'&&x.locId===locId&&x.at>item.at&&(!nextIn||x.at<nextIn.at)&&minutesBetween(item.at,x.at)<=30*60);if(end){worked+=minutesBetween(item.at,end.at);outputs.push([item,end])}else{open=true;outputs.push([item,null])}}return{starts,outputs,worked:Math.round(worked),open}}
function override(empId,date,locId){return S.overrides.find(v=>v.empId===empId&&v.date===date&&v.locId===locId)}
function dayStatus(e,date,locId){if(!employeeAt(e,date))return 'F';let o=override(e.id,date,locId);if(o)return o.status;let z=eventsDay(e.id,locId,date);if(z.starts.length)return z.open&&date<today()?'RP':'P';let praznik=holiday(locId,date,e);if(praznik)return praznik.type==='religious'?'VH':'H';if(!isWorking(locId,date))return 'ND';if(date>=today())return 'F';return 'N'}
function employeeNames(locId,date){return S.employees.filter(e=>employeeAt(e,date)&&assigned(e,date)===locId)}
function monthEmployees(locId,y,m){let pref=ymd(y,m,1),last=ymd(y,m,new Date(y,m,0).getDate());return S.employees.filter(e=>{let from=e.hiredAt||'1900-01-01',to=e.terminatedAt||'9999-12-31';if(from>last||to<pref)return false;for(let day=1;day<=new Date(y,m,0).getDate();day++){let d=ymd(y,m,day);if(employeeAt(e,d)&&assigned(e,d)===locId)return true}return S.events.some(v=>v.empId===e.id&&v.locId===locId&&dateOfEvent(v.at).slice(0,7)===pref.slice(0,7))}).sort((a,b)=>a.name.localeCompare(b.name,'bs'))}
function monthMetrics(e,locId,y,m){let v={P:0,N:0,GO:0,BO:0,ND:0,RP:0,H:0,VH:0,F:0,minutes:0};for(let i=1;i<=new Date(y,m,0).getDate();i++){let date=ymd(y,m,i);if(!employeeAt(e,date)||assigned(e,date)!==locId)continue;let s=dayStatus(e,date,locId);v[s]++;v.minutes+=eventsDay(e.id,locId,date).worked}return v}
function selections(locId){return S.locations.map(l=>`<option value="${esc(l.id)}" ${locId===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}
function nav(){return `<div class="nav">${[['pregled','▦ Pregled'],['kalendar','▦ Kalendar'],['radnici','♙ Radnici'],['objekti','▣ Objekti'],['odsustva','▤ Praznici i odsustva'],['izvjestaji','▥ Izvještaji'],['istorija','◷ Istorija'],['arhiva','▦ Arhiva 2025'],['postavke','⚙ Postavke']].map(([r,t])=>`<button class="tab ${route===r?'on':''}" data-route="${r}">${t}</button>`).join('')}</div>`}
function header(){return `<header class="top"><div class="brand"><div class="brand-mark">B</div><div><div class="brand-name">BALKAN <span class="desktop-only">– Evidencija zaposlenih</span></div><div class="subtitle">${unlocked&&route!=='kiosk'?'Administratorski pregled':'Prijava i odjava radnika'}</div></div></div><div class="top-actions"><span class="pill warning desktop-only">● Firebase – provjera veze</span>${unlocked?`<button class="btn small" data-route="pregled">Administracija</button><button class="btn small" data-route="kiosk">Skeniranje</button><button class="btn small" data-act="logout">Odjavi admina</button>`:`${S.admin?'<button class="btn small" data-act="login">🔒 Administracija</button>':''}`}</div></header>`}
function shell(content){return `<div class="shell">${header()}${content}<div class="footer">BALKAN · Zajednička evidencija · Firebase baza · Status veze prikazan gore</div></div>`}
function render(){if(!S)return;if(route!=='kiosk'&&route!=='setup'&&!unlocked)route='kiosk';let out;if(route==='setup')out=setupScreen();else if(route==='kiosk')out=kioskScreen();else out=`<div class="container">${nav()}${({pregled:overview,kalendar:calendar,radnici:workers,objekti:locations,odsustva:absences,izvjestaji:reports,istorija:history,arhiva:()=>`<div id="histContainer">${window.BALKAN_ARCHIVE?.display?.()||'Arhiva se učitava.'}</div>`,postavke:settings}[route]||overview)()}</div>`;$('app').innerHTML=shell(out);if(route==='kiosk')setTimeout(()=>$('barcode')?.focus(),30)}
function setupScreen(){return `<main class="kiosk"><div class="panel mainpanel"><div class="bigicon">🔐</div><h1>Prvo pokretanje</h1><p class="muted">Kreiraj administratorsku lozinku za ovu lokalnu instalaciju. Radnici ne trebaju lozinku.</p><form id="setupForm" class="grid" style="text-align:left"><div class="field"><label>Administratorska lozinka (najmanje 8 znakova)</label><input id="newpw" type="password" required minlength="8" autocomplete="new-password"></div><div class="field"><label>Ponovi lozinku</label><input id="newpw2" type="password" required minlength="8" autocomplete="new-password"></div><button class="btn primary" type="submit">Pokreni evidenciju</button></form><div class="note">Ovo je lokalna verzija. Lozinka štiti pristup administratorskom ekranu, ali ne zamjenjuje serversku zaštitu podataka.</div></div></main>`}
function kioskScreen(){let loc=S.locations.find(l=>l.id===S.station)||S.locations[0];return `<main class="kiosk"><div class="panel mainpanel"><div class="badge">${esc(loc?.name||'Objekat')}</div><div class="bigicon">▥</div><h1>Evidencija radnog vremena</h1><p class="muted">Izaberi dolazak ili odlazak, zatim skeniraj karticu zaposlenog.</p><div class="mode-select"><button data-act="mode-in" class="mode ${mode==='in'?'active in':''}">→ PRIJAVA</button><button data-act="mode-out" class="mode ${mode==='out'?'active out':''}">← ODJAVA</button></div><form id="scanForm"><div class="field" style="text-align:left"><label>Barkod radnika</label><input id="barcode" class="scanfield" placeholder="Skenirajte karticu" autocomplete="off" autofocus required></div><button class="btn primary" style="width:100%;margin-top:14px;padding:15px" type="submit">${mode==='in'?'Potvrdi dolazak':'Potvrdi odlazak'}</button></form><div id="scanresult">${toast?toast:''}</div><p class="smalltext" style="margin-top:22px">Kartica se prepoznaje samo dok je ovaj ekran otvoren i polje za barkod aktivno.</p></div><p class="smalltext" style="text-align:center">Skeniranje koristi vrijeme ovog računara. Službena online potvrda biće dostupna poslije povezivanja centralne baze.</p></main>`}
function pageTitle(title,sub,buttons=''){return `<div class="intro"><div><h1>${title}</h1><div class="muted">${sub}</div></div><div class="actionline">${buttons}</div></div>`}
function overview(){let d=today(),emp=employeeNames(adminLoc,d),present=emp.filter(e=>evs(e.id,adminLoc,d).some(x=>x.kind==='in')||override(e.id,d,adminLoc)?.status==='P').length,leave=emp.filter(e=>override(e.id,d,adminLoc)?.status==='GO').length,sick=emp.filter(e=>override(e.id,d,adminLoc)?.status==='BO').length,noCheck=emp.filter(e=>dayStatus(e,d,adminLoc)==='F'&&!evs(e.id,adminLoc,d).length&&!override(e.id,d,adminLoc)).length,incomplete=emp.filter(e=>{let z=eventsDay(e.id,adminLoc,d);return z.open}).length;let sc=getSchedule(adminLoc,d),openAlert='';if(sc&&sc.days.includes(wd(d))&&!holiday(adminLoc,d)&&minutes(`${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`)>minutes(sc.open)+Number(sc.grace||0)){let first=S.events.filter(x=>x.locId===adminLoc&&x.kind==='in'&&dateOfEvent(x.at)===d).sort((a,b)=>a.at.localeCompare(b.at))[0];if(!first)openAlert=`<div class="note">⚠ Nema prve prijave za danas. Podešeno otvaranje: ${esc(sc.open)}. Ovo <b>ne dokazuje</b> da objekat nije otvoren.</div>`;else if(minutes(clock(first.at))>minutes(sc.open)+Number(sc.grace||0))openAlert=`<div class="note">⚠ Prva evidentirana prijava: <b>${clock(first.at)}</b> (planirano otvaranje: <b>${esc(sc.open)}</b>). Ovo nije automatski kašnjenje pojedinog radnika.</div>`}
let rows=emp.map(e=>{let z=eventsDay(e.id,adminLoc,d),st=dayStatus(e,d,adminLoc),first=z.starts[0];return `<tr><td><b>${esc(e.name)}</b></td><td><span class="badge ${st}">${esc(statusText(st))}</span></td><td>${first?clock(first.at):'—'}</td><td>${z.outputs.filter(x=>x[1]).map(x=>clock(x[1].at)).join(', ')||'—'}</td><td><button class="btn small" data-day="${d}" data-emp="${e.id}" data-loc="${adminLoc}">Detalji</button></td></tr>`}).join('');return `${pageTitle('Pregled za danas',`Stvarna prijavljivanja radnika · ${dateTimeDisplay(new Date().toISOString())}`)}<div class="panel"><div class="toolbar"><div class="field"><label>Objekat</label><select data-field="adminLoc">${selections(adminLoc)}</select></div><button class="btn" data-route="kalendar">Otvori mjesečni kalendar →</button><button class="btn primary" data-act="manual">+ Ručna evidencija</button></div></div><div class="grid stats"><div class="stat green"><div class="cap">Prijavljeni danas</div><div class="num">${present}</div></div><div class="stat red"><div class="cap">Još bez prijave</div><div class="num">${noCheck}</div></div><div class="stat blue"><div class="cap">Na godišnjem</div><div class="num">${leave}</div></div><div class="stat"><div class="cap">Na bolovanju</div><div class="num">${sick}</div></div><div class="stat orange"><div class="cap">Otvorene prijave</div><div class="num">${incomplete}</div></div></div>${openAlert}<div class="panel"><div class="panel-head"><h2>Zaposleni – ${esc(locName(adminLoc))}</h2><span class="smalltext">${emp.length} radnika u evidenciji za današnji dan</span></div><div class="tablewrap"><table class="simpletable"><thead><tr><th>Radnik</th><th>Status</th><th>Dolazak</th><th>Odjava</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="list-empty">Nema zaposlenih. Dodaj radnika u administraciji.</td></tr>'}</tbody></table></div><p class="smalltext">"Još bez prijave" označava da trenutno nema skeniranja, ne da je radnik neopravdano odsutan.</p></div>`}
function calendar(){let n=new Date(calY,calM,0).getDate(),first=ymd(calY,calM,1),emps=monthEmployees(calLoc,calY,calM),loc=locName(calLoc);let heads=Array.from({length:n},(_,i)=>`<th>${i+1}<br><span style="font-weight:400">${WEEK[wd(ymd(calY,calM,i+1))]}</span></th>`).join(''),body=emps.map(e=>{let v=monthMetrics(e,calLoc,calY,calM);return `<tr><td class="name">${esc(e.name)}</td>${Array.from({length:n},(_,i)=>{let date=ymd(calY,calM,i+1),status=dayStatus(e,date,calLoc);return `<td><button title="${esc(statusText(status))} – ${esc(e.name)} – ${date}" class="cell ${status} ${chosenDate===date&&chosenEmp===e.id?'selected':''}" data-day="${date}" data-emp="${e.id}" data-loc="${calLoc}">${LEGEND[status][0]}</button></td>`}).join('')}<td class="total">${v.P+v.RP}</td></tr>`}).join('');let selected=S.employees.find(e=>e.id===chosenEmp);return `${pageTitle('Mjesečni kalendar','Brzi pregled svih zaposlenih i svih dana u mjesecu',`<button class="btn" data-act="exportcsv">↓ Excel (CSV)</button><button class="btn" data-act="print">⎙ Štampaj / PDF</button><button class="btn primary" data-act="manual">+ Dodaj ručno</button>`)}<div class="panel"><div class="toolbar"><div class="field"><label>Objekat</label><select data-field="calLoc">${selections(calLoc)}</select></div><div class="field"><label>Godina</label><input type="number" data-field="calY" min="2000" max="2100" value="${calY}"></div><div class="field"><label>Mjesec</label><select data-field="calM">${MONTHS.map((m,i)=>`<option value="${i+1}" ${calM===i+1?'selected':''}>${m}</option>`).join('')}</select></div><button class="btn" data-act="prevmonth">‹ Prethodni</button><button class="btn" data-act="nextmonth">Sljedeći ›</button></div></div><div class="two-col"><section class="panel" style="min-width:0"><div class="panel-head"><h2>${MONTHS[calM-1]} ${calY}. · ${esc(loc)}</h2><span class="smalltext">${emps.length} zaposlenih</span></div><div class="tablewrap"><table class="calendar"><thead><tr><th class="name">Radnik</th>${heads}<th>Rad.</th></tr></thead><tbody>${body||`<tr><td colspan="${n+2}" class="list-empty">Nema radnika za odabrani period.</td></tr>`}</tbody></table></div><div class="legend">${Object.entries(LEGEND).map(([k,v])=>`<span><b style="background:var(--${({P:'greenp',N:'redp',GO:'bluep',BO:'purplep',ND:'grayp',RP:'orangep',H:'bluep',F:'grayp'})[k]})"></b>${esc(v[1])}</span>`).join('')}</div><div class="note info">Crvena znači <b>nema prijave</b> na protekli radni dan, ne automatski neopravdan izostanak. Nepotpuna odjava je narandžasta.</div></section><aside class="panel" id="dayPanel">${selected?dayPanel(selected,chosenDate,calLoc):`<h2>Brzi detalji</h2><p class="muted">Klikni na obojeno polje u kalendaru da vidiš radnika, datum, tačno vrijeme prijave i odjave i mogućnost ispravke.</p>`}</aside></div>`}
function dayPanel(e,date,locId){let code=dayStatus(e,date,locId),z=eventsDay(e.id,locId,date),o=override(e.id,date,locId),sc=getSchedule(locId,date),late=null;if(z.starts.length&&sc&&isWorking(locId,date)){let diff=minutes(clock(z.starts[0].at))-minutes(sc.open);if(diff>Number(sc.grace||0))late=diff}let evRows=evs(e.id,locId,date).map(v=>`<div style="display:flex;align-items:center;gap:7px;justify-content:space-between;border-bottom:1px solid #edf1f8;padding:8px 0"><span>${v.kind==='in'?'→ Dolazak':'← Odlazak'} · <b>${clock(v.at)}</b> <span class="smalltext">${v.source==='manual'?'(ručno)':'(barkod)'}</span></span><button class="btn small danger" data-del-event="${v.id}">✕</button></div>`).join('');return `<h2>Brzi detalji</h2><h3>${esc(e.name)}</h3><span class="smalltext">${date.split('-').reverse().join('.')} · ${esc(locName(locId))}</span><div class="detail-rows"><div>Status</div><div class="value"><span class="badge ${code}">${esc(statusText(code))}</span></div><div>Prva prijava</div><div class="value">${z.starts.length?clock(z.starts[0].at):'—'}</div><div>Potvrđena odjava</div><div class="value">${z.outputs.some(x=>x[1])?z.outputs.filter(x=>x[1]).map(x=>clock(x[1].at)).join(', '):'—'}</div><div>Potvrđeni sati</div><div class="value">${z.starts.length&&z.outputs.every(x=>x[1])?humanMinutes(z.worked):'—'}</div><div>Radno vrijeme objekta</div><div class="value">${sc?esc(sc.open+'–'+sc.close):'Nije podešeno'}</div></div>${late!=null?`<div class="note">Prva prijava je ${late} min nakon vremena otvaranja objekta. To ne dokazuje individualno kašnjenje.</div>`:''}${z.open?`<div class="note">${date<today()?'Nedostaje odjava. Ne obračunavamo nepoznate sate.':'Prijava je još otvorena.'}</div>`:''}${o?`<div class="note info">Ručna oznaka: ${esc(statusText(o.status))}. ${esc(o.note||'')}</div>`:''}<h3 style="margin-top:18px">Skeniranja</h3>${evRows||'<p class="smalltext">Nema zabilježenih skeniranja.</p>'}<div class="actionline" style="margin-top:18px"><button class="btn primary" data-act="manual" data-man-emp="${e.id}" data-man-date="${date}" data-man-loc="${locId}">+ Ispravi / dodaj</button><button class="btn" data-worker-history="${e.id}">Istorija radnika</button></div>`}
function workers(){return `${pageTitle('Radnici','Zaposleni, barkodovi i pripadnost objektima',`<button class="btn primary" data-act="add-worker">+ Dodaj radnika</button>`)}<div class="panel"><div class="tablewrap"><table class="simpletable"><thead><tr><th>Ime i prezime</th><th>Barkod</th><th>Objekat</th><th>Status</th><th>Radni odnos</th><th>Opcije</th></tr></thead><tbody>${S.employees.slice().sort((a,b)=>a.name.localeCompare(b.name,'bs')).map(e=>`<tr><td><b>${esc(e.name)}</b></td><td><code>${esc(e.barcode)}</code></td><td>${esc(locName(e.defaultLocationId))}</td><td><span class="badge ${e.active?'P':'ND'}">${e.active?'Aktivan':'Deaktiviran'}</span></td><td>${esc(e.hiredAt||'—')} ${e.terminatedAt?'→ '+esc(e.terminatedAt):''}</td><td><div class="actionline"><button class="btn small" data-edit-worker="${e.id}">Uredi</button><button class="btn small" data-print-card="${e.id}">Kartica</button><button class="btn small" data-worker-history="${e.id}">Evidencija</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="list-empty">Nema radnika. Klikni „Dodaj radnika“.</td></tr>'}</tbody></table></div></div>`}
function locations(){return `${pageTitle('Objekti','Posebno radno vrijeme i istorija sezonskih promjena',`<button class="btn primary" data-act="add-location">+ Dodaj objekat</button>`)}<div class="cards">${S.locations.map(l=>{let sc=getSchedule(l.id,today());return `<div class="loc-card"><div class="title">▣ ${esc(l.name)}</div><div class="smalltext">${l.active?'Aktivan objekat':'Neaktivan objekat'}</div><p><b>${sc?esc(sc.open+'–'+sc.close):'Nije podešeno'}</b><br><span class="smalltext">Radni dani: ${sc?sc.days.map(i=>WEEK[i]).join(', '):'—'}</span></p><p class="smalltext">${l.schedules.length} zabilježenih verzija radnog vremena</p><button class="btn small primary" data-location-edit="${l.id}">Uredi / sezonsko vrijeme</button></div>`}).join('')}</div>`}
function absences(){return `${pageTitle('Praznici i odsustva','Evidentiranje godišnjeg, bolovanja, neradnih dana i praznika',`<button class="btn primary" data-act="manual">+ Evidencija radnika</button><button class="btn" data-act="add-holiday">+ Praznik</button>`)}<div class="panel"><h2>Praznici i posebni dani</h2><div class="tablewrap"><table class="simpletable"><thead><tr><th>Datum</th><th>Naziv</th><th>Primjena</th><th></th></tr></thead><tbody>${S.holidays.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(h=>`<tr><td>${esc(h.date)}${h.endDate&&h.endDate!==h.date?' → '+esc(h.endDate):''}</td><td>${esc(h.label)}<br><small>${h.type==='religious'?'Vjerski':h.type==='state'?'Državni':'Posebni / stariji unos'}</small></td><td>${h.employeeId?esc(S.employees.find(e=>e.id===h.employeeId)?.name||'Radnik'):(h.locationId?esc(locName(h.locationId)):'Svi objekti')}</td><td><button class="btn small danger" data-del-holiday="${h.id}">Ukloni</button></td></tr>`).join('')||'<tr><td colspan="4" class="list-empty">Nema unesenih praznika.</td></tr>'}</tbody></table></div><div class="note info">Praznik je oznaka u evidenciji, ne automatski obračun zakonskog prava na plaćeno odsustvo.</div></div>`}
function reports(){return `${pageTitle('Izvještaji','Mjesečni i godišnji pregled rada',`<button class="btn primary" data-act="exportcsv">↓ Preuzmi Excel (CSV)</button><button class="btn" data-act="print">⎙ Štampaj / PDF</button>`)}<div class="panel"><div class="toolbar"><div class="field"><label>Objekat</label><select data-field="calLoc">${selections(calLoc)}</select></div><div class="field"><label>Godina</label><input type="number" data-field="calY" value="${calY}" min="2000" max="2100"></div><div class="field"><label>Mjesec</label><select data-field="calM">${MONTHS.map((m,i)=>`<option value="${i+1}" ${calM===i+1?'selected':''}>${m}</option>`).join('')}</select></div></div></div><div class="panel"><h2>Sažetak – ${MONTHS[calM-1]} ${calY}.</h2><div class="tablewrap"><table class="simpletable"><thead><tr><th>Radnik</th><th>Dana prisustva</th><th>Bez prijave</th><th>Godišnji</th><th>Bolovanje</th><th>Potvrđeni sati</th></tr></thead><tbody>${monthEmployees(calLoc,calY,calM).map(e=>{let x=monthMetrics(e,calLoc,calY,calM);return `<tr><td>${esc(e.name)}</td><td>${x.P+x.RP}</td><td>${x.N}</td><td>${x.GO}</td><td>${x.BO}</td><td>${humanMinutes(x.minutes)}</td></tr>`}).join('')||'<tr><td colspan="6">Nema zapisa.</td></tr>'}</tbody></table></div><div class="note">Odrađeni sati uključuju samo parove dolazak/odjava. Ako nedostaje odjava, sati nisu potpuni i potrebno je da administrator potvrdi odlazak.</div></div>`}
function history(){return `${pageTitle('Istorija izmjena','Zapisnik administrativnih intervencija')}<div class="panel"><div class="tablewrap"><table class="simpletable"><thead><tr><th>Vrijeme</th><th>Radnja</th><th>Detalj</th><th>Korisnik</th></tr></thead><tbody>${S.audit.slice(0,500).map(a=>`<tr><td>${dateTimeDisplay(a.at)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td><td>${esc(a.by)}</td></tr>`).join('')||'<tr><td colspan="4" class="list-empty">Još nema administrativnih izmjena.</td></tr>'}</tbody></table></div></div>`}
function settings(){return `${pageTitle('Postavke','Lokalna instalacija, sigurnosne kopije i stanica za skeniranje')}<div class="panel"><h2>Računar za skeniranje</h2><div class="fields"><div class="field"><label>Koji je ovo objekat?</label><select data-field="station">${selections(S.station)}</select></div></div><p class="smalltext">Kada se aplikacija otvori na kasi, skeniranja se pripisuju izabranom objektu. Kancelarijski računar može izabrati bilo koji objekat u administraciji.</p></div><div class="panel"><h2>Čuvanje i vraćanje podataka</h2><div class="actionline"><button class="btn primary" data-act="backup">↓ Preuzmi sigurnosnu kopiju (JSON)</button><button class="btn" data-act="restore">↑ Vrati sigurnosnu kopiju</button></div><div class="note">⚠ Podaci su trenutno samo na ovom računaru i u ovom pregledniku. Nema automatske razmjene između marketa i kancelarije. Ne briši podatke preglednika; redovno pravi sigurnosne kopije. Lozinka u lokalnoj aplikaciji nije zamjena za serversku kontrolu pristupa.</div></div><div class="panel"><h2>Stara Excel evidencija</h2><p>Uvoz Excel evidencije je namjerno ostavljen za kasniju fazu. Istorijske podatke ćemo pripremiti na osnovu tvoje stvarne tabele, bez pretpostavljanja starih sati dolaska i odlaska.</p></div>`}
// DIALOGS
function modal(title,body,foot=''){let root=$('modal');root.innerHTML=`<div class="modalroot" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h2>${esc(title)}</h2><button type="button" class="btn small" data-act="close-modal">✕</button></div>${body}${foot}</div></div>`}
function closeModal(){$('modal').innerHTML=''}

function locationForm(id){let l=S.locations.find(x=>x.id===id),sc=l?getSchedule(l.id,today()):null,days=sc?.days||[1,2,3,4,5,6];modal(l?'Objekat i sezonsko radno vrijeme':'Dodaj objekat',`<form id="locationForm" class="grid"><input type="hidden" name="id" value="${esc(id||'')}"><div class="field"><label>Naziv objekta *</label><input required name="name" value="${esc(l?.name||'')}" placeholder="Restoran, Market 3..."></div><div class="field"><label>Novo radno vrijeme važi od datuma</label><input type="date" name="from" required value="${today()}"></div><div class="fields"><div class="field"><label>Otvaranje</label><input name="open" type="time" required value="${esc(sc?.open||'08:00')}"></div><div class="field"><label>Zatvaranje</label><input name="close" type="time" required value="${esc(sc?.close||'20:00')}"></div><div class="field"><label>Tolerancija prve prijave (min.)</label><input name="grace" min="0" max="180" type="number" value="${sc?.grace||0}"></div><div class="field"><label>Norma plaćenih sati po radnom danu</label><input name="paidHours" type="number" min="0" max="16" step="0.25" value="${sc?.paidHours||''}" placeholder="Npr. 8"><small>Za obračunske sate praznika; nije jednako trajanju otvorenosti marketa.</small></div></div><div class="field"><label>Radni dani objekta</label><div class="weekdays">${[1,2,3,4,5,6,0].map(i=>`<label class="weekday"><input type="checkbox" name="day${i}" ${days.includes(i)?'checked':''}>${WEEK[i]}</label>`).join('')}</div></div><div class="note info">Stare postavke ostaju u istoriji. Novi raspored važi od odabranog datuma, uključujući i ako se unese promjena za raniji datum.</div>${l?`<h3>Historija promjena</h3><div class="tablewrap"><table class="simpletable"><thead><tr><th>Važi od</th><th>Otvaranje</th><th>Zatvaranje</th></tr></thead><tbody>${l.schedules.slice().sort((a,b)=>b.from.localeCompare(a.from)).map(s=>`<tr><td>${s.from}</td><td>${s.open}</td><td>${s.close}</td></tr>`).join('')}</tbody></table></div>`:''}<div class="modalfoot"><button class="btn" type="button" data-act="close-modal">Odustani</button><button type="submit" class="btn primary">Sačuvaj</button></div></form>`)}

async function hashPass(pass,salt){if(!crypto?.subtle)throw Error('Ovaj preglednik ne podržava sigurno podešavanje lozinke. Otvori u novijem Chromeu.');let key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);let b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(salt),iterations:170000,hash:'SHA-256'},key,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function createAdmin(p){let salt=Array.from(crypto.getRandomValues(new Uint8Array(16)));S.admin={salt,hash:await hashPass(p,salt)};await save();route='kiosk';render()}
function loginDialog(){modal('Prijava administratora',`<form id="loginForm" class="grid"><div class="field"><label>Administratorska lozinka</label><input name="password" type="password" autocomplete="current-password" required autofocus></div><div class="modalfoot"><button class="btn" type="button" data-act="close-modal">Odustani</button><button class="btn primary" type="submit">Prijavi se</button></div></form>`)}
async function scan(code){code=code.trim();let e=S.employees.find(x=>x.barcode.toLowerCase()===code.toLowerCase()&&x.active);if(!e){scanFeedback('err','Kartica nije prepoznata. Obratite se administratoru.');return}let now=new Date().toISOString(),locId=S.station;if(!employeeAt(e,today())){scanFeedback('err','Radnik nije aktivan na ovaj datum.');return}let recent=S.events.filter(v=>v.empId===e.id&&v.locId===locId).sort((a,b)=>b.at.localeCompare(a.at))[0];if(recent&&minutesBetween(recent.at,now)<1){scanFeedback('warn','Kartica je upravo skenirana – pokušaj duplog skeniranja je zaustavljen.');return}if(mode==='out'){let arr=allEvents(e.id),last=arr[arr.length-1];if(!last||last.kind!=='in'||last.locId!==locId){scanFeedback('err','Nema otvorene prijave ovog radnika u ovom objektu. Administrator može izvršiti ispravku.');return}}else{let arr=allEvents(e.id),last=arr[arr.length-1];if(last?.kind==='in'){scanFeedback('warn',`Radnik ${e.name} već ima otvorenu prijavu. Prvo je potrebno evidentirati odjavu.`);return}}S.events.push({id:uid(),empId:e.id,locId,kind:mode,at:now,source:'barcode'});await save();scanFeedback('ok',`${esc(e.name)} · ${mode==='in'?'DOLAZAK':'ODLAZAK'} potvrđen u ${clock(now)} · ${esc(locName(locId))}`)}
function scanFeedback(kind,msg){toast=`<div class="success-banner ${kind}">${msg}</div>`;render();setTimeout(()=>$('barcode')?.focus(),60)}
function modalCard(empId){let e=S.employees.find(x=>x.id===empId);if(!e)return;let code=String(e.barcode).toUpperCase();if(!/^[0-9A-Z .\-$/+%]+$/.test(code)){alert('Za štampanje Code 39 kartice barkod smije sadržavati brojeve, velika slova i osnovne znakove. Ručno postavljeni barkod i dalje može raditi na skeneru.');return}let svg=makeCode39(code);modal('Kartica zaposlenog',`<div class="print-card" id="employeeCard"><b style="font-size:20px">BALKAN</b><p style="margin:6px 0">${esc(e.name)}</p>${svg}<div style="font-weight:700;letter-spacing:2px">${esc(code)}</div><div class="smalltext">Kartica za evidenciju prisustva</div></div><div class="note info">Kartica koristi Code 39. Provjeri podržava li ga postojeći barkod čitač prije masovne štampe.</div><div class="modalfoot"><button class="btn" data-act="close-modal">Zatvori</button><button class="btn primary" data-act="print-card">⎙ Štampaj karticu</button></div>`)}
const CODE39={"0":"bsbSBsBsb","1":"BsbSbsbsB","2":"bsBSbsbsB","3":"BsBSbsbsb","4":"bsbSBsbsB","5":"BsbSBsbsb","6":"bsBSBsbsb","7":"bsbSbsBsB","8":"BsbSbsBsb","9":"bsBSbsBsb","A":"BsbsbSbsB","B":"bsBsbSbsB","C":"BsBsbSbsb","D":"bsbsBSbsB","E":"BsbsBSbsb","F":"bsBsBSbsb","G":"bsbsbSBsB","H":"BsbsbSBsb","I":"bsBsbSBsb","J":"bsbsBSBsb","K":"BsbsbsbSB","L":"bsBsbsbSB","M":"BsBsbsbSb","N":"bsbsBsbSB","O":"BsbsBsbSb","P":"bsBsBsbSb","Q":"bsbsbsBSB","R":"BsbsbsBSb","S":"bsBsbsBSb","T":"bsbsBsBSb","U":"BSbsbsbsB","V":"bSBsbsbsB","W":"BSBsbsbsb","X":"bSbsBsbsB","Y":"BSbsBsbsb","Z":"bSBsBsbsb","-":"bSbsbsBsB",".":"BSbsbsBsb"," ":"bSBsbsBsb","*":"bSbsBsBsb","$":"bSbSbSbsb","/":"bSbSbsbSb","+":"bSbsbSbSb","%":"bsbSbSbSb"};
function makeCode39(code){let q='*'+code+'*',units=[];for(let ch of q){let pat=CODE39[ch];if(!pat)return'';for(let s of pat)units.push({bar:s==='b'||s==='B',w:s===s.toUpperCase()?3:1});units.push({bar:false,w:1})}let px=2,x=10,h=65,rects='';for(let s of units){if(s.bar)rects+=`<rect x="${x}" y="2" width="${s.w*px}" height="${h}" fill="#101820"/>`;x+=s.w*px}return `<svg viewBox="0 0 ${x+10} ${h+4}" xmlns="http://www.w3.org/2000/svg" aria-label="Barkod Code39"><rect width="100%" height="100%" fill="white"/>${rects}</svg>`}
function workerDetails(id){let e=S.employees.find(x=>x.id===id);if(!e)return;let events=allEvents(id).slice().reverse().slice(0,100);modal('Istorija radnika – '+e.name,`<p class="muted">Barkod: <b>${esc(e.barcode)}</b>. Prikaz posljednjih 100 skeniranja. Mjesečni zbir nalazi se u izvještajima.</p><div class="tablewrap"><table class="simpletable"><thead><tr><th>Datum i vrijeme</th><th>Događaj</th><th>Objekat</th><th>Izvor</th></tr></thead><tbody>${events.map(x=>`<tr><td>${dateTimeDisplay(x.at)}</td><td>${x.kind==='in'?'Dolazak':'Odlazak'}</td><td>${esc(locName(x.locId))}</td><td>${x.source==='manual'?'Ručni unos':'Barkod'}</td></tr>`).join('')||'<tr><td colspan="4">Nema događaja.</td></tr>'}</tbody></table></div>`)}
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function makeCsv(){let emps=monthEmployees(calLoc,calY,calM),count=new Date(calY,calM,0).getDate(),header=['Radnik','Barkod',...Array.from({length:count},(_,i)=>pad(i+1)), 'Prisutan dana','Bez prijave','Godišnji','Bolovanje','Potvrđeni minuti','Plaćeni praznični minuti','Sati rada + praznici (min)','Kašnjenje (min)','Dani praznika'];let rows=[header.map(csvCell).join(';')];for(let e of emps){let v=monthMetrics(e,calLoc,calY,calM),r=reportFigures(e,calLoc,Array.from({length:count},(_,i)=>ymd(calY,calM,i+1)));rows.push([e.name,e.barcode,...Array.from({length:count},(_,i)=>dayStatus(e,ymd(calY,calM,i+1),calLoc)),v.P+v.RP,v.N,v.GO,v.BO,v.minutes,r.paid,r.total,r.late,r.holidays].map(csvCell).join(';'))}return rows.join('\r\n')}
function download(name,content,mime){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function csvExport(){download(`BALKAN_${calY}-${pad(calM)}_${locName(calLoc).replace(/\W+/g,'_')}.csv`,'\ufeff'+makeCsv(),'text/csv;charset=utf-8')}
function printCards(){let c=$('employeeCard');if(!c)return;let w=window.open('','_blank','width=500,height=400');if(!w){alert('Dozvoli otvaranje prozora za štampu.');return}w.document.write('<html><head><title>Štampaj karticu</title><style>body{font-family:Arial;text-align:center;padding:35px}.print-card{margin:auto;width:300px;border:1px dashed #aaa;padding:15px}svg{width:100%;height:75px}</style></head><body>'+c.outerHTML+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),250)}

function restoreForm(){modal('Vrati sigurnosnu kopiju',`<p class="note">Ovo će ZAMIJENITI svu postojeću lokalnu evidenciju na ovom računaru. Prvo napravi vlastitu sigurnosnu kopiju.</p><form id="restoreForm"><div class="field"><label>Izaberi ranije spremljen JSON</label><input name="file" type="file" required accept=".json,application/json"></div><div class="modalfoot"><button class="btn" type="button" data-act="close-modal">Odustani</button><button class="btn primary" type="submit">Provjeri i vrati kopiju</button></div></form>`)}

// UI INTERACTIONS
$('app').addEventListener('click',async e=>{let t=e.target.closest('[data-route],[data-act],[data-day],[data-edit-worker],[data-print-card],[data-worker-history],[data-location-edit],[data-del-event],[data-del-holiday]');if(!t)return;
if(t.dataset.route){if(t.dataset.route==='kiosk'&&route!=='kiosk'){unlocked=false;sessionStorage.removeItem('balkan_admin')}route=t.dataset.route;toast='';render();return}if(t.dataset.day){
 chosenDate=t.dataset.day;chosenEmp=t.dataset.emp;
 const worker=S.employees.find(e=>e.id===chosenEmp);
 if(!worker)return;
 const location=t.dataset.loc, events=evs(worker.id,location,chosenDate);
 const previous=dayStatus(worker,chosenDate,location),h=holiday(location,chosenDate,worker);
 if(!employeeAt(worker,chosenDate)||assigned(worker,chosenDate)!==location){
  alert('Radnik nema radni odnos/dodjelu na taj datum.');return;
 }
 if(events.length||h||['GO','BO','ND','VH','H','RP'].includes(previous)){
  render();$('dayPanel')?.scrollIntoView({behavior:'smooth',block:'nearest'});return;
 }
 let next=previous==='P'?'N':'P';
 S.overrides=S.overrides.filter(x=>!(x.empId===worker.id&&x.date===chosenDate&&x.locId===location));
 S.overrides.push({id:uid(),empId:worker.id,locId:location,date:chosenDate,status:next,note:'Brzi klik u kalendaru; bez potvrđenih sati',updatedAt:new Date().toISOString()});
 audit('Brza izmjena u kalendaru',worker.name+' '+chosenDate+': '+previous+' → '+next);
 try{await save();render()}catch(err){alert('Promjena nije sačuvana: '+err.message)}
 $('dayPanel')?.scrollIntoView({behavior:'smooth',block:'nearest'});return
}
if(t.dataset.editWorker){workerForm(t.dataset.editWorker);return}if(t.dataset.printCard){modalCard(t.dataset.printCard);return}if(t.dataset.workerHistory){workerDetails(t.dataset.workerHistory);return}if(t.dataset.locationEdit){locationForm(t.dataset.locationEdit);return}
if(t.dataset.delEvent){if(!confirm('Obrisati ovaj događaj? Izmjena ostaje u administratorskoj istoriji.'))return;let v=S.events.find(x=>x.id===t.dataset.delEvent);S.events=S.events.filter(x=>x.id!==t.dataset.delEvent);audit('Uklonjeno skeniranje',`${v?.empId} ${v?.kind} ${v?.at}`);await save();render();return}
if(t.dataset.delHoliday){if(!confirm('Ukloniti praznik?'))return;let h=S.holidays.find(x=>x.id===t.dataset.delHoliday);S.holidays=S.holidays.filter(x=>x.id!==t.dataset.delHoliday);audit('Uklonjen praznik',h?.label);await save();render();return}
switch(t.dataset.act){case'mode-in':mode='in';toast='';render();break;case'mode-out':mode='out';toast='';render();break;case'login':loginDialog();break;case'logout':sessionStorage.removeItem('balkan_admin');unlocked=false;route='kiosk';render();break;case'add-worker':workerForm();break;case'add-location':locationForm();break;case'manual':manualForm(t.dataset.manEmp,t.dataset.manDate,t.dataset.manLoc);break;case'add-holiday':holidayForm();break;case'prevmonth':{calM--;if(calM===0){calM=12;calY--}render();break}case'nextmonth':{calM++;if(calM===13){calM=1;calY++}render();break}case'exportcsv':csvExport();break;case'print':window.print();break;case'backup':doExport();break;case'restore':restoreForm();break}
});

let persistedBaseline=null, syncBusy=false, syncWake=null, suppressDiff=false, syncLastError='';
function ensureV2(){
 if(!S._sync)S._sync={url:'',token:'',deviceId:uid(),seeded:false,lastAt:null};
 if(!Array.isArray(S._pending))S._pending=[];
 if(!Array.isArray(S._localBackups))S._localBackups=[];
 for(const key of SYNC_NAMES)if(!Array.isArray(S[key]))S[key]=[];
}
function diffRecords(prev,next){
 const ops=[];
 for(const col of SYNC_NAMES){
   const old=new Map((prev?.[col]||[]).map(x=>[x.id,JSON.stringify(x)]));
   const now=new Map((next[col]||[]).map(x=>[x.id,JSON.stringify(x)]));
   for(const [id,value] of now)if(old.get(id)!==value)ops.push({id:uid(),collection:col,key:id,type:'set',value:JSON.parse(value)});
   for(const [id] of old)if(!now.has(id))ops.push({id:uid(),collection:col,key:id,type:'delete'});
 }
 return ops;
}
function saveLocalSnapshot(){
 const date=today(),last=S._localBackups[0];
 if(last?.date===date)return;
 // Automatska lokalna kopija se čuva u istom pregledniku. Ne zamjenjuje vanjsku kopiju.
 const data={...S};delete data._pending;delete data._localBackups;delete data._sync;
 S._localBackups.unshift({date,at:new Date().toISOString(),data:structuredClone(data)});
 S._localBackups=S._localBackups.slice(0,7);
}
const v1save=save;
save=async function(){
 ensureV2();
 if(!suppressDiff&&persistedBaseline){
   const changes=diffRecords(persistedBaseline,S);
   for(const op of changes){
     // Stvarna skeniranja već su pojedinačno evidentirana. Za ručne izmjene čuvamo prije/poslije.
     if(op.collection==='audit'||(op.collection==='events'&&op.type==='set'&&op.value?.source==='barcode'))continue;
     const before=(persistedBaseline[op.collection]||[]).find(v=>v.id===op.key)||null;
     const after=op.type==='delete'?null:op.value;
     const describe=(v)=>v==null?'(nema)':JSON.stringify(v).slice(0,650);
     audit('Promjena / prije-poslije',`${op.collection} ${op.key} | PRIJE ${describe(before)} | POSLIJE ${describe(after)}`);
   }
   S._pending.push(...diffRecords(persistedBaseline,S));
 }
 saveLocalSnapshot();
 await v1save();
 persistedBaseline=structuredClone(S);
 if(S._sync.url && S._sync.token)queueSync();
};
const v1init=init;
init=async function(){
 await v1init();ensureV2();
 if(!S._localBackups.length){saveLocalSnapshot();await v1save();}
 persistedBaseline=structuredClone(S);
 render();
 window.addEventListener('online',()=>queueSync(300));
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)queueSync(300)});
 window.setInterval(()=>{if(!document.hidden)queueSync(0)},20000);
 if(S._sync.url&&S._sync.token)queueSync(500);
};
function syncStatus(){
 ensureV2();let pending=S._pending.length,enabled=!!(S._sync.url&&S._sync.token);
 if(!enabled)return '<div class="sync-banner bad">⚠ Ovaj računar radi lokalno. Centralna sinhronizacija još nije podešena.</div>';
 return `<div class="sync-banner ${pending||syncLastError||!S._sync.lastAt?'bad':'good'}">${syncBusy?'⟳ U toku sinhronizacija…':pending?'⚠ Čeka sinhronizaciju':S._sync.lastAt?'✓ Lokalno usklađeno sa serverom':'⚠ Čeka prvu potvrdu servera'} · Neposlano: <b>${pending}</b> · Posljednja potvrda: <b>${S._sync.lastAt?dateTimeDisplay(S._sync.lastAt):'još nije potvrđeno'}</b>${syncLastError?' · Greška: '+esc(syncLastError):''}</div>`;
}
function queueSync(delay=1200){if(syncWake)clearTimeout(syncWake);syncWake=setTimeout(()=>{syncWake=null;syncNow()},delay)}
function bootstrapOps(){
 if(S._sync.seeded)return;
 const queued=new Set(S._pending.filter(o=>o.type==='set').map(o=>o.collection+':'+o.key));
 for(const col of SYNC_NAMES)for(const v of S[col]||[])if(!queued.has(col+':'+v.id))S._pending.push({id:uid(),collection:col,key:v.id,type:'seed',value:structuredClone(v)});
 S._sync.seeded=true;
}
function normalizeSyncUrl(url){
 url=url.trim().replace(/\/+$/,'');
 const u=new URL(url);
 if(u.protocol!=='https:'&&!(u.protocol==='http:'&&['localhost','127.0.0.1'].includes(u.hostname)))throw Error('Za drugi računar koristi HTTPS adresu servera. HTTP dozvoljen samo lokalno.');
 return url;
}
async function syncNow(){
 if(syncBusy||!S?._sync?.url||!S._sync.token||!navigator.onLine)return;
 syncBusy=true;syncLastError='';
 try{
   bootstrapOps();
   let sent=S._pending.slice();
   await v1save();persistedBaseline=structuredClone(S);
   const res=await fetch(S._sync.url+'/api/sync',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S._sync.token},body:JSON.stringify({deviceId:S._sync.deviceId,ops:sent}),cache:'no-store',signal:AbortSignal.timeout(12000)});
   if(!res.ok)throw Error('Server: HTTP '+res.status);
   const response=await res.json();
   if(!response.ok||!response.state)throw Error('Odgovor servera nije ispravan.');
   // Ne gubimo izmjene koje su nastale za vrijeme slanja zahtjeva.
   const sentIds=new Set(sent.map(op=>op.id));
   const remaining=S._pending.filter(op=>!sentIds.has(op.id));
   const next=structuredClone(S);
   for(const col of SYNC_NAMES){
     const byId=new Map((response.state[col]||[]).map(v=>[v.id,v]));
     for(const op of remaining.filter(v=>v.collection===col)){
       if(op.type==='delete')byId.delete(op.key);
       else if(op.type==='set')byId.set(op.key,op.value);
       else if(op.type==='seed'&&!byId.has(op.key))byId.set(op.key,op.value);
     }
     next[col]=[...byId.values()];
   }
   next._pending=remaining;next._sync.lastAt=new Date().toISOString();
   S=next;
   await v1save();persistedBaseline=structuredClone(S);
   if(remaining.length)queueSync(1200);
   if(route!=='kiosk'&&route!=='setup')render();
 }catch(e){syncLastError=e.message; if(route==='postavke')render();}
 finally{syncBusy=false;}
}
function alertsFor(locId,date=today()){
 const out=[],sc=getSchedule(locId,date),employees=employeeNames(locId,date);
 const first=S.events.filter(v=>v.locId===locId&&v.kind==='in'&&dateOfEvent(v.at)===date).sort((a,b)=>a.at.localeCompare(b.at))[0];
 const sameDay=(date===today());
 if(sc&&isWorking(locId,date)&&!holiday(locId,date)){
   let start=minutes(sc.open),timeNow=minutes(`${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`);
   if((!sameDay||timeNow>start+Number(sc.grace||0))&&!first)out.push({kind:'warning',text:`Nema prve evidentirane prijave u objektu (otvaranje ${sc.open}).`,note:'To ne potvrđuje da je objekat bio zatvoren.'});
   else if(first&&minutes(clock(first.at))>start+Number(sc.grace||0))out.push({kind:'warning',text:`Prva prijava bila je u ${clock(first.at)}, nakon podešenog otvaranja ${sc.open}.`,note:'Ne znači automatski da pojedini radnik kasni.'});
 }
 const missing=employees.filter(e=>!evs(e.id,locId,date).some(x=>x.kind==='in')&&(!override(e.id,date,locId)||override(e.id,date,locId).status==='N'));
 if(missing.length&&date<=today()&&isWorking(locId,date))out.push({kind:'info',text:`Bez prijave: ${missing.length} radnika`,note:'Bez unaprijed unesenog rasporeda ne možemo tvrditi da su trebali raditi.'});
 const open=employees.filter(e=>eventsDay(e.id,locId,date).open);
 if(open.length)out.push({kind:'warning',text:`Prijavljeni bez odjave: ${open.map(e=>e.name).join(', ')}`,note:'Nedostajuća odjava ne proizvodi izmišljene radne sate.'});
 const clashes=employees.filter(e=>{const a=allEvents(e.id);return a.some((v,i)=>v.kind==='in'&&a.slice(i+1).some(w=>w.kind==='in'&&w.locId!==v.locId&&minutesBetween(v.at,w.at)<18*60&&!a.some(o=>o.kind==='out'&&o.at>v.at&&o.at<w.at)))});
 if(clashes.length)out.push({kind:'warning',text:`Provjeri prijave u više objekata: ${clashes.map(e=>e.name).join(', ')}`,note:'Može biti potrebno ručno uskladiti događaje.'});
 return out;
}

function annualEmployeeCard(id,year=new Date().getFullYear()){
 let e=S.employees.find(x=>x.id===id);if(!e)return;
 let summary={present:0,missing:0,leave:0,sick:0,hours:0},rows='';
 for(let m=1;m<=12;m++){
   let sum={P:0,RP:0,N:0,GO:0,BO:0,minutes:0};
   for(let day=1;day<=new Date(year,m,0).getDate();day++){
     let date=ymd(year,m,day);if(!employeeAt(e,date))continue;
     const loc=assigned(e,date);const status=dayStatus(e,date,loc);
     if(sum[status]!==undefined)sum[status]++;
     sum.minutes+=eventsDay(e.id,loc,date).worked;
   }
   summary.present+=sum.P+sum.RP;summary.missing+=sum.N;summary.leave+=sum.GO;summary.sick+=sum.BO;summary.hours+=sum.minutes;
   rows+=`<tr><td>${MONTHS[m-1]}</td><td>${sum.P+sum.RP}</td><td>${sum.N}</td><td>${sum.GO}</td><td>${sum.BO}</td><td>${humanMinutes(sum.minutes)}</td></tr>`;
 }
 modal('Godišnji karton – '+e.name,`<div class="compact-row"><button class="btn small" data-year-card="${id}" data-year="${year-1}">‹ ${year-1}</button><h2 style="margin:0">${year}. godina</h2><button class="btn small" data-year-card="${id}" data-year="${year+1}">${year+1} ›</button></div><p class="muted">${esc(e.name)} · ${esc(locName(e.defaultLocationId))} · istorija ostaje dostupna i kada radnik bude deaktiviran.</p><div class="yearcard"><table class="simpletable"><thead><tr><th>Mjesec</th><th>Prisutnih dana</th><th>Bez prijave</th><th>Godišnji</th><th>Bolovanje</th><th>Potvrđeni sati</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>UKUPNO</td><td>${summary.present}</td><td>${summary.missing}</td><td>${summary.leave}</td><td>${summary.sick}</td><td>${humanMinutes(summary.hours)}</td></tr></tfoot></table></div><div class="modalfoot"><button class="btn" data-worker-events="${id}">Posljednja skeniranja</button><button class="btn" data-act="close-modal">Zatvori</button></div>`);
}

function xmlEscape(x){return String(x).replace(/[<>&"']/g,v=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[v]))}

$('app').addEventListener('click',e=>{let el=e.target.closest('[data-leave-emp],[data-leave-grant],[data-leave-new],[data-leave-template],[data-leave-doc],[data-leave-print],[data-leave-cancel]');if(!el)return;if(!unlocked)return alert('Samo administrator može izdavati rješenja.');
 if(el.dataset.leaveEmp){leaveEmployeeId=el.dataset.leaveEmp;route='godisnji';render();return}
 if(el.dataset.leaveGrant){leaveGrantForm(el.dataset.leaveGrant);return}
 if(el.dataset.leaveNew){leaveDecisionForm(el.dataset.leaveNew);return}
 if(el.dataset.leaveTemplate){leaveTemplateForm();return}
 if(el.dataset.leaveDoc){docDecision(el.dataset.leaveDoc,'docx');return}
 if(el.dataset.leavePrint){docDecision(el.dataset.leavePrint,'print');return}
 if(el.dataset.leaveCancel){let d=S.leaveDecisions.find(x=>x.id===el.dataset.leaveCancel);if(!d)return;let why=prompt('Razlog storniranja rješenja (obavezno):');if(!why?.trim())return; if(!confirm('Stornirati rješenje? Ostaje u istoriji, dani se oslobađaju.'))return;d.status='cancelled';d.cancelledReason=why.trim();d.cancelledAt=new Date().toISOString();audit('Stornirano rješenje godišnjeg',`${d.number} / ${d.employeeName} – ${why}`);save().then(()=>render());}

$('app').addEventListener('change',e=>{let el=e.target;if(!el.dataset.leaveField)return;if(el.dataset.leaveField==='employee'){leaveEmployeeId=el.value;render()}if(el.dataset.leaveField==='year'){leaveYear=Number(el.value)||new Date().getFullYear();render()}});
$('modal').addEventListener('submit',async e=>{let f=e.target;if(!['leaveGrantForm','leaveDecisionForm','leaveTemplateForm'].includes(f.id))return;
 e.preventDefault();e.stopImmediatePropagation();if(!unlocked)return alert('Prijavi se kao administrator.');let d=fmtData(f);
 try{ensureV2();
 if(f.id==='leaveTemplateForm'){
 let t=S.leaveTemplates.find(x=>x.id==='annual-main');if(!d.body.trim())throw Error('Šablon ne može biti prazan.');Object.assign(t,{employer:d.employer.trim(),place:d.place.trim(),director:d.director.trim(),body:d.body,updatedAt:new Date().toISOString()});audit('Izmijenjen šablon rješenja',`Sačuvan tekst šablona (${d.body.length} znakova) i podaci poslodavca.`);await save();closeModal();render();return;}
 if(f.id==='leaveGrantForm'){
 let n=Number(d.days),year=Number(d.year);if(!Number.isInteger(n)||n<0||n>365)throw Error('Broj dana nije ispravan.');let days=d.weekMode==='custom'?String(d.customDays||'').split(',').map(x=>Number(x.trim())):d.weekMode==='6'?[1,2,3,4,5,6]:[1,2,3,4,5];if(days.length<5||days.length>6||new Set(days).size!==days.length||days.some(x=>!Number.isInteger(x)||x<0||x>6))throw Error('Radna sedmica mora imati tačno 5 ili 6 različitih dana (0–6).');let g=leaveGrant(d.empId,year),already=leaveCount(d.empId,year).reserved;
 if(n<already)throw Error(`Već je odobreno/evidentirano ${already} dana. Ne možeš smanjiti fond ispod toga.`);
 if(g)Object.assign(g,{days:n,weekdays:days,note:d.note,updatedAt:new Date().toISOString()});else S.leaveGrants.push({id:uid(),empId:d.empId,year,days:n,weekdays:days,note:d.note,updatedAt:new Date().toISOString()});
 audit('Utvrđen godišnji fond',`${S.employees.find(x=>x.id===d.empId)?.name}: ${year}, ${n} dana, ${days.length}-dnevna sedmica`);await save();closeModal();route='godisnji';render();return;}
 if(f.id==='leaveDecisionForm'){
 let g=leaveGrant(d.empId,Number(d.year));if(!g)throw Error('Prvo utvrdi pravo na godišnji odmor.');if(!d.number.trim())throw Error('Unesi broj rješenja.');if(d.deliveredAt>d.from)throw Error('Datum dostave ne smije biti poslije početka odmora bez posebne pravne provjere.');
 if(d.deliveredAt<d.issuedAt)throw Error('Datum dostave ne može prethoditi datumu donošenja rješenja.');let noticeDays=Math.round((new Date(d.from+'T12:00:00Z')-new Date(d.deliveredAt+'T12:00:00Z'))/86400000);if(noticeDays<30&&!f.elements.shortNotice.checked)throw Error('Za dostavu manje od 30 dana prije početka potrebna je saglasnost zaposlenog i poslodavca.');
 let excluded=String(d.excluded||'').split(/[\s,;]+/).filter(Boolean);if(excluded.some(x=>!/^\d{4}-\d{2}-\d{2}$/.test(x)))throw Error('Izuzeti datumi moraju biti YYYY-MM-DD.');let days=leaveDays(d.from,d.to,g.weekdays,excluded,d.empId);
 if(!days.length)throw Error('Period nema obračunskih radnih dana.');let duplicates=days.filter(x=>existingLeaveDay(d.empId,x)||S.overrides.some(o=>o.empId===d.empId&&o.date===x&&o.status==='GO'));if(duplicates.length)throw Error('Ovi datumi već postoje u drugom rješenju: '+duplicates.slice(0,10).join(', '));
 let conflicts=days.filter(date=>S.events.some(v=>v.empId===d.empId&&dateOfEvent(v.at)===date&&v.kind==='in')||S.overrides.some(o=>o.empId===d.empId&&o.date===date&&['BO','P','ND'].includes(o.status)));
 if(conflicts.length)throw Error('Period se preklapa sa postojećim prisustvom/bolovanjem/slobodnim danom: '+conflicts.slice(0,10).join(', ')+'. Prvo provjeri status.');
 let summary=leaveCount(d.empId,Number(d.year));if(days.length>summary.remaining)throw Error(`Previše dana (${days.length}). Preostalo za odobravanje: ${summary.remaining}.`);
 let employee=S.employees.find(e=>e.id===d.empId),tpl=S.leaveTemplates.find(x=>x.id==='annual-main');if(days.some(x=>!employeeAt(employee,x)))throw Error('Godišnji odmor ne smije biti izvan perioda radnog odnosa tog radnika.');let issued={id:uid(),empId:d.empId,employeeName:employee.name,year:Number(d.year),number:d.number.trim(),from:d.from,to:d.to,days,excluded,status:'issued',issuedAt:d.issuedAt,deliveredAt:d.deliveredAt,shortNotice:!!f.elements.shortNotice.checked,position:d.position,residence:d.residence,contract:d.contract,entitlementAtIssue:g.days,remainingAtIssue:summary.remaining-days.length,templateSnapshot:structuredClone(tpl),createdAt:new Date().toISOString()};
 S.leaveDecisions.push(issued);
 // Podaci o radnom mjestu ostaju u evidenciji radnika; JMB se ne čuva.
 Object.assign(employee,{position:d.position,residence:d.residence,contract:d.contract});
 audit('Izdato rješenje godišnjeg',`${issued.number}: ${employee.name}, ${issued.from}–${issued.to}, ${days.length} radnih dana za ${issued.year}.`);
 await save();closeModal();route='godisnji';render();
 if(confirm('Rješenje je sačuvano. Otvoriti pregled za štampanje?'))docDecision(issued.id,'print');return;}
 }catch(err){alert('Godišnji odmori: '+err.message)}
},true);

const ORIGINAL_WORD_PARAGRAPHS=["Na osnovu člana 83 stav 2 Zakona o radu (\"Sl. list CG\", br. 074/19, 008/21, 059/21, 068/21, 145/21, 077/24, 084/24, 086/24, 122/25, 165/25, 051/26) i člana 9 Opšteg kolektivnog ugovora (”Sl. list CG”, br. 150/22), kao i ugovora o radu, izvršni direktor {{POSLODAVAC}} {{MJESTO_POSLODAVCA}} donosi: ","","","RJEŠENJE O KORIŠĆENJU GODIŠNJEG ODMORA ","","Zaposlenom/-oj   {{RADNIK}} iz {{MJESTO_RADNIKA}}, JMB: {{JMB}}, u radnom odnosu {{VRSTA_UGOVORA}}, raspoređenom/-oj na radnom mjestu {{RADNO_MJESTO}}, odobrava se godišnji odmor za kalendarsku {{GODINA}}. godinu, u trajanju od {{PRAVO_DANA}} radnih dana.","","Trajanje godišnjeg odmora utvrđuje se srazmjerno vremenu provedenom u radnom odnosu. Zaposleni ima pravo na 1/12 godišnjeg odmora za svaki započeti mjesec dana rada kod poslodavca ako u toj kalendarskoj godini zasniva radni odnos ili mu prestaje radni odnos kod poslodavca. Zaposleni ima pravo na godišnji odmor u trajanju od najmanje 20 radnih dana za kalendarsku godinu. ","Zaposleni koji radi šest radnih dana ima pravo na godišnji odmor u trajanju od 24 radna dana. ","Zaposleni mlađi od 18 godina života ima pravo na godišnji odmor u trajanju od 24 dana.","Zaposleno lice sa invaliditetom ima pravo na godišnji odmor u trajanju od najmanje 26 radnih dana.","","Godišnji odmor se uvećava:","prema dužini radnog staža:","od 5-15 godina - 1 radni dan","od 15-25 godina - 2 radna dana","od 25-35 godina - 3 radna dana","preko 35 godina – 5 radna dana","prema zdravstvenom stanju:","roditelju djeteta koje ima smetnje u razvoju - 3 radna dana ","samohranom roditelju djeteta do 15 godina života – 2 radna dana","","Korišćenje godišnjeg odmora za {{GODINA}}. godinu će zaposleni započeti sa korišćenjem kada proces i organizacija rada budu dozvolili, stim da isti ima obavezu da isti iskoristi najkasnije i zaključno sa 30.06.{{GODINA_NAREDNA}}. godine, a sve u dogovoru sa direktno nadređenim. ","","Zaposleni će koristiti odmoru u periodu od {{OD}} do {{DO}}.","","","NAPOMENA: \nOrganizator procesa rada je u obavezi da prati i na propisan način evidentira dane korišćenja godišnjeg odmora zaposlenog. ","\nPRAVNA POUKA: ","Protiv ovog Rešenja zaposleni ima pravo prigovora donosiocu istog u roku od 8 (osam) dana od dana prijema Rešenja. ","                                                                                                                                      ","                                                                                                                              ","Izvršni direktor{{DIREKTOR_DODATAK}}\t\t","                                                                                                                                 ","","","_________________________________","Dostavljeno:","Zaposlenom/oj                                                                                                                                 ","Dosije zaposlenog\t\t\t\t\t   \t                       \t\t                                                          \t     "];
const ORIGINAL_WORD_BODY=ORIGINAL_WORD_PARAGRAPHS.join('\n');

const _v4_previous_init=init;
init=async function(){
  await _v4_previous_init();

    t.body=ORIGINAL_WORD_BODY;

const _v4_previous_filledDecision=filledDecision;

function originalVars(d,jmb=''){
  const e=S.employees.find(x=>x.id===d.empId),
    t=d.templateSnapshot||S.leaveTemplates.find(x=>x.id==='annual-main'),
    g=leaveGrant(d.empId,d.year);
  return {
    RADNIK:d.employeeName||e?.name||'___________________',
    MJESTO_RADNIKA:d.residence||'_________',
    JMB:jmb||'___________________',
    RADNO_MJESTO:d.position||'___________________',
    VRSTA_UGOVORA:d.contract||'na određeno vrijeme',
    OD:fmtDateBos(d.from),DO:fmtDateBos(d.to).replace(/\.$/,''),
    GODINA:String(d.year),GODINA_NAREDNA:String(Number(d.year)+1),
    PRAVO_DANA:String(d.entitlementAtIssue??g?.days??'__'),
    POSLODAVAC:t.employer||'DOO BALKAN',
    MJESTO_POSLODAVCA:t.place||'Gusinje',

}
function replaceOriginalFields(txt,d,jmb=''){
  const vars=originalVars(d,jmb);
  return String(txt).replace(/\{\{([A-Z_]+)\}\}/g,(m,key)=>vars[key]===undefined?m:vars[key]);
}
function originalDocBody(d){
  return d.templateSnapshot?.body||S.leaveTemplates.find(x=>x.id==='annual-main')?.body||ORIGINAL_WORD_BODY;
}
function originalPreviewParagraphs(d,jmb=''){

}

function originalStyledDocx(d,jmb=''){
  const original=originalDocBody(d).split('\n'),
    entries=Object.fromEntries(Object.entries(ORIGINAL_WORD_PARTS).map(([name,part])=>[name,binaryPart(part)]));
  let xml=new TextDecoder().decode(entries['word/document.xml']);
  if(original.join('\n')!==ORIGINAL_WORD_BODY){
    // Preserve page settings, original numbering, margins, paragraph-level style and unchanged text runs.
    const parser=new DOMParser(),doc=parser.parseFromString(xml,'application/xml');
    if(doc.getElementsByTagName('parsererror').length)throw Error('Word šablon nije moguće pročitati.');
    const ns='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
    const body=doc.getElementsByTagNameNS(ns,'body')[0];
    let nodes=Array.from(body.children).filter(x=>x.localName==='p');
    // Changed number of paragraphs: remove excess or append extra paragraphs before section settings.
    while(nodes.length>original.length){body.removeChild(nodes.pop())}
    while(nodes.length<original.length){
      let clone=nodes[nodes.length-1].cloneNode(true);
      const textNodes=Array.from(clone.getElementsByTagNameNS(ns,'t'));
      textNodes.forEach(t=>t.textContent='');
      body.insertBefore(clone,body.getElementsByTagNameNS(ns,'sectPr')[0]);nodes.push(clone);
    }
    for(let i=0;i<original.length;i++){
      if(original[i]===ORIGINAL_WORD_PARAGRAPHS[i])continue;
      const node=nodes[i],ts=Array.from(node.getElementsByTagNameNS(ns,'t'));
      if(ts.length){ts[0].textContent=original[i];ts[0].setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');for(let j=1;j<ts.length;j++)ts[j].textContent=''}
      else{
        const run=doc.createElementNS(ns,'w:r'),t=doc.createElementNS(ns,'w:t');t.textContent=original[i];t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');run.appendChild(t);node.appendChild(run);
      }
    }
    xml=new XMLSerializer().serializeToString(doc);
  }
  const vars=originalVars(d,jmb);
  for(const [key,value] of Object.entries(vars)){
    xml=xml.replaceAll('{{'+key+'}}',xmlEscape(value));
  }
  // Fail closed on unknown field names; no invented legal data.
  if(/\{\{[A-Z_]+\}\}/.test(xml))throw Error('Neprepoznato dinamičko polje u šablonu. Provjeri tekst prije štampe.');
  entries['word/document.xml']=new TextEncoder().encode(xml);
  return v4ZipParts(entries);
}

function plannedStart(employee,date){return employee.shiftCalendar?.[date]||employee.shiftStart||''}
function tardiness(employee,date,locId){
 const z=eventsDay(employee.id,locId,date),scheduled=plannedStart(employee,date),sc=getSchedule(locId,date);
 if(!z.starts.length||!scheduled||!sc||!isWorking(locId,date)||holiday(locId,date,employee))return null;
 return Math.max(0,minutes(clock(z.starts[0].at))-minutes(scheduled)-Number(sc.grace||0));
}
function reportFigures(employee,locId,dates){
 let actual=0,paid=0,late=0,lateDays=0,holidays=0,unclosed=0,unconfigured=0;
 for(const date of dates){
  if(!employeeAt(employee,date)||assigned(employee,date)!==locId)continue;
  const z=eventsDay(employee.id,locId,date),sc=getSchedule(locId,date),status=dayStatus(employee,date,locId);
  actual+=z.worked;if(z.open)unclosed++;
  const d=tardiness(employee,date,locId);if(d!=null&&d>0){late+=d;lateDays++}
  if((status==='H'||status==='VH')&&!z.starts.length&&isWorking(locId,date)&&sc){
   holidays++;
   const hours=Number(employee.paidHours||sc.paidHours||0);
   if(hours>0)paid+=Math.round(hours*60);else unconfigured++;
  }
 }
 return{actual,paid,total:actual+paid,late,lateDays,holidays,unclosed,unconfigured}
}
const _baseReport=reports;
reports=function(){
 const base=_baseReport(),n=new Date(calY,calM,0).getDate(),dates=Array.from({length:n},(_,i)=>ymd(calY,calM,i+1));
 const employees=monthEmployees(calLoc,calY,calM);
 const rows=employees.map(e=>{
  const r=reportFigures(e,calLoc,dates);
  return '<tr><td>'+esc(e.name)+'</td><td>'+humanMinutes(r.actual)+'</td><td>'+humanMinutes(r.paid)+'</td><td><b>'+humanMinutes(r.total)+'</b></td><td>'+r.lateDays+' / '+r.late+' min</td><td>'+r.unclosed+(r.unconfigured?' / nenormirano: '+r.unconfigured:'')+'</td></tr>';
 }).join('');
 const weeks=new Map();
 for(const date of dates){
  const d=localDate(date);d.setDate(d.getDate()-((d.getDay()+6)%7));
  const key=ymd(d.getFullYear(),d.getMonth()+1,d.getDate());
  if(!weeks.has(key))weeks.set(key,[]);
  weeks.get(key).push(date);
 }
 const weekRows=[...weeks.values()].flatMap(ds=>employees.map(e=>{
  const r=reportFigures(e,calLoc,ds);
  return '<tr><td>'+esc(ds[0].slice(8)+'–'+ds.at(-1).slice(8)+'.'+pad(calM))+'</td><td>'+esc(e.name)+'</td><td>'+humanMinutes(r.actual)+'</td><td>'+humanMinutes(r.paid)+'</td><td>'+humanMinutes(r.total)+'</td><td>'+r.late+' min</td></tr>';
 })).join('');
 return base+'<section class="panel"><h2>Radni sati, praznici i kašnjenja · '+MONTHS[calM-1]+' '+calY+'</h2>'+
 '<p class="smalltext">Stvarni sati su potvrđeni dolasci/odlasci. Plaćeni praznici su odvojeni i računaju se po unesenoj normi sati za jedan radni dan (Objekti).</p>'+
 '<div class="tablewrap"><table class="simpletable balkan-hrs-table"><thead><tr><th>Radnik</th><th>Stvarno odrađeno</th><th>Plaćeni praznici</th><th>Ukupno obračunski</th><th>Kašnjenja / minuta</th><th>Bez odjave / bez norme</th></tr></thead><tbody>'+
 (rows||'<tr><td colspan="6">Nema radnika.</td></tr>')+'</tbody></table></div>'+
 '<p class="smalltext">Kašnjenje računamo samo kad postoji početak smjene za tog radnika; samo radno vrijeme marketa nije dokaz kašnjenja.</p></section>'+
 '<section class="panel"><h2>Sedmični pregled sati</h2><div class="tablewrap"><table class="simpletable balkan-hrs-table"><thead><tr><th>Period u mjesecu</th><th>Radnik</th><th>Odrađeno</th><th>Pl. praznici</th><th>Obračunski</th><th>Kašnjenje</th></tr></thead><tbody>'+
 (weekRows||'<tr><td colspan="6">Nema podataka.</td></tr>')+'</tbody></table></div></section>';
};
