name: BALKAN Firestore security audit
on:
  push:
    branches: [main]
    paths: ['firestore.rules','firebase.json','tests/firestore-security-rules.mjs','.github/workflows/firestore-security.yml']
  pull_request:
    branches: [main]
    paths: ['firestore.rules','firebase.json','tests/firestore-security-rules.mjs','.github/workflows/firestore-security.yml']
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator and test tooling
        run: npm install --no-save firebase-tools@14 firebase@11 @firebase/rules-unit-testing@4
      - name: Validate rules in a real Firestore emulator
        run: npx firebase emulators:exec --project demo-balkan-rules --only firestore "node tests/firestore-security-rules.mjs"
